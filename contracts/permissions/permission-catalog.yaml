version: 1.0.0
permissions:
  - id: network.request
    scope: plugin
    description: Outbound HTTPS request restricted to declared origins, paths, methods, and purposes (READ/AUTH/WRITE).
    default_granted: false
  - id: account.session
    scope: plugin
    description: Scoped access to a specific school or parcel provider session via PluginBroker without raw secret exposure.
    default_granted: false
  - id: storage.scoped
    scope: plugin
    description: Partitioned key-value/table storage isolated by (publisher, packageId, version, schoolId, profileId).
    default_granted: false
  - id: notification.send
    scope: plugin
    description: Send sanitized user notifications through host NotificationChannel.
    default_granted: false
  - id: location.coarse
    scope: plugin
    description: Coarse campus location for matching nearest parcel station or library building.
    default_granted: false
  - id: library.booking.read
    scope: host_and_plugin
    description: Read library areas, seat snapshots, and current user bookings.
    default_granted: true
  - id: library.booking.create
    scope: host_only_gated
    description: Submit seat reservation at target T; requires active user consent, school authorization evidence, and kill_switch=false.
    default_granted: false
  - id: parcel.read
    scope: host_and_plugin
    description: Read canonical parcels, traces, and pickup stations within current campus profile.
    default_granted: true
  - id: parcel.ai.invoke
    scope: host_only_gated
    description: Send user-approved parcel fields to opt-in AI assistant; off by default.
    default_granted: false
  - id: ui.slot.render
    scope: plugin
    description: Render declarative extension cards in approved host UI slots.
    default_granted: true
  - id: parcel.write.import
    scope: plugin
    description: Submit normalized parcel snapshots from authorized campus station plugins.
    default_granted: false
  - id: group.read
    scope: user_school_scope
    description: Read groups and active membership visible to the authenticated user within the same school_id scope.
    default_granted: true
  - id: group.create
    scope: user_school_scope
    description: Create study, dorm, club, or project groups after verified campus binding in the requested school_id scope.
    default_granted: true
  - id: group.join
    scope: user_school_scope
    description: Accept a valid group invite or QR payload inside the matching school_id scope.
    default_granted: true
  - id: group.manage
    scope: user_school_scope
    description: Update or archive a group; requires GROUP_OWNER or GROUP_ADMIN authorization inside that group.
    default_granted: false
  - id: group.invite.manage
    scope: user_school_scope
    description: Create or revoke expiring, use-limited group invites; requires GROUP_OWNER or GROUP_ADMIN authorization.
    default_granted: false
  - id: group.member.manage
    scope: user_school_scope
    description: Manage group roles, sharing levels, removal, or self-service leave; school scope isolation is mandatory.
    default_granted: false
  - id: group.availability.write
    scope: user_school_scope
    description: Upload, replace, or withdraw the caller's own quantized busy-block share inside a group; never permits writing another member's availability.
    default_granted: true
  - id: group.availability.read
    scope: user_school_scope
    description: Run privacy-minimizing intersection queries and read per-member AVAILABLE/BUSY/UNKNOWN states inside an active group; raw busy blocks are not exposed by query results.
    default_granted: true
  - id: group.poll.create
    scope: user_school_scope
    description: Create deadline-bound time polls as an active group member in the same school scope.
    default_granted: true
  - id: group.poll.read
    scope: user_school_scope
    description: Read poll options, deadline, per-option results, caller vote, and confirmation state as an active group member.
    default_granted: true
  - id: group.poll.vote
    scope: user_school_scope
    description: Cast or change the caller's single-choice vote while a group poll is OPEN.
    default_granted: true
  - id: group.poll.confirm
    scope: user_school_scope
    description: Confirm a poll option as the terminal group event; limited to the poll creator or GROUP_OWNER/GROUP_ADMIN in the same school scope.
    default_granted: false
  - id: group.ledger.read
    scope: user_school_scope
    description: Read append-only ledger postings, deterministic shares, member balances, and settlement history inside an active group and the same school_id scope.
    default_granted: true
  - id: group.ledger.write
    scope: user_school_scope
    description: Append expense, refund, or correction postings for a group; never permits payment execution or rewriting existing postings.
    default_granted: true
  - id: group.settlement.write
    scope: user_school_scope
    description: Propose, confirm, or cancel settlement records when the caller is an authorized party; confirmation only records mutual acknowledgement and never moves money.
    default_granted: true
  - id: group.duty.read
    scope: user_school_scope
    description: Read duty rotation schedules, generated tasks, assignment state, completion confirmation state, and pending/terminal swap audit records inside an active group.
    default_granted: true
  - id: group.duty.write
    scope: user_school_scope
    description: Complete caller-assigned duty tasks and request or resolve one-task swaps or covers according to party and group-role rules.
    default_granted: true
  - id: group.duty.confirm
    scope: user_school_scope
    description: Confirm completion of another active member's duty task; self-confirmation is forbidden.
    default_granted: true
  - id: group.duty.manage
    scope: user_school_scope
    description: Create and update duty rotation schedules and mark still-pending tasks SKIPPED as the owner/admin leave disposition; requires GROUP_OWNER or GROUP_ADMIN authorization inside the group.
    default_granted: false
  - id: group.repair.read
    scope: user_school_scope
    description: Read dorm repair records, workflow state, and review state inside an active group.
    default_granted: true
  - id: group.repair.write
    scope: user_school_scope
    description: Submit repair records, edit editable reporter metadata, and submit the reporter's one-time review; does not contact external maintenance systems.
    default_granted: true
  - id: group.repair.manage
    scope: user_school_scope
    description: Triage, assign, progress, resolve, reject, or close repair records; requires GROUP_OWNER or GROUP_ADMIN authorization inside the group.
    default_granted: false
  - id: place.status.read
    scope: user_school_scope
    description: Read user-reported place status aggregates, divergence, provenance, and visible correction history inside the caller school scope.
    default_granted: true
  - id: place.status.report
    scope: user_school_scope
    description: Submit direct observations and append-only corrections for Campus Graph places; never permits claiming official realtime status.
    default_granted: true
  - id: place.status.subscribe
    scope: user_school_scope
    description: Create, list, and cancel caller-owned in-app notification subscriptions for place.status.changed within the caller school scope.
    default_granted: true
  - id: place.status.flag
    scope: user_school_scope
    description: Flag incorrect, stale, abusive, spam, or PII-containing place status reports for explicit review.
    default_granted: true
  - id: place.status.moderate
    scope: operations_school_scope
    description: Review place report flags and keep or exclude individual reports from aggregation with audit evidence; never permits rewriting user observations or fabricating corrected status.
    default_granted: false
  - id: ugc.read
    scope: user_school_scope
    description: CT-05 reserved semantics only; would read school-scoped forum boards, posts, floor replies, and post search results if the feature is ever enabled. The endpoint family currently returns uniform 501 FEATURE_NOT_ENABLED.
    default_granted: true
  - id: ugc.write
    scope: user_school_scope
    description: CT-05 reserved semantics only; would create posts, delete the caller's own posts, and append floor replies inside the caller school scope if ever enabled. The endpoint family currently returns uniform 501 FEATURE_NOT_ENABLED.
    default_granted: true
  - id: ugc.report
    scope: user_school_scope
    description: CT-05 reserved semantics only; would file user reports against posts, replies, or media objects for operations review if ever enabled. The endpoint family currently returns uniform 501 FEATURE_NOT_ENABLED.
    default_granted: true
  - id: ugc.media.write
    scope: user_school_scope
    description: CT-05 reserved semantics only; would mint and complete media upload slots whose payloads are EXIF-stripped, WebP-converted, randomly named, and privately bucketed if ever enabled. The endpoint family currently returns uniform 501 FEATURE_NOT_ENABLED.
    default_granted: true
  - id: ugc.moderate
    scope: operations_school_scope
    description: CT-05 reserved semantics only; would review the moderation queue and apply audited keep/hide/delete/reject dispositions with security audit evidence if ever enabled; never permits rewriting user content. The endpoint family currently returns uniform 501 FEATURE_NOT_ENABLED.
    default_granted: false
  - id: content_pack.read
    scope: user_school_scope
    description: Read signed school-package and dis-datapack/v1 catalog metadata, versions, provenance, lifecycle status, and detached signature facts in the requested school catalog scope. Authentication is required, but catalog visibility is not proof of campus binding or official school verification.
    default_granted: true
  - id: content_pack.download
    scope: user_school_scope
    description: Download exact non-retired content package artifact bytes after reading digest and signature metadata; rate limits and retirement remain enforced.
    default_granted: true
  - id: content_pack.submit
    scope: user_school_scope
    description: Submit public-source school-package or data-pack artifacts for maintainer review; acceptance never implies publication, verification, or school approval.
    default_granted: true
  - id: content_pack.review
    scope: operations_school_scope
    description: Review content pack submissions in an explicit school-scoped maintainer queue and approve, request changes, or reject with audit evidence; approval never rewrites artifact provenance or implies school authorization.
    default_granted: false
  - id: content_pack.publish
    scope: operations_school_scope
    description: Publish approved maintainer-signed immutable content pack versions; requires explicit operations authorization in the matching school scope and never implies school verification.
    default_granted: false
  - id: content_pack.retire
    scope: operations_school_scope
    description: Retire published content pack versions without deleting history, causing new downloads/installs to fail closed while preserving audit metadata; requires explicit operations authorization in the matching school scope independent of publish authorization.
    default_granted: false
roles:
  - role: PLATFORM_OWNER
    allowed_actions: [read_overview, manage_schools, toggle_kill_switch, approve_school_auth, read_orders, reconcile_orders, approve_refund, read_audit]
    forbidden_actions: [read_plaintext_school_password]
  - role: OPERATIONS_ADMIN
    allowed_actions: [read_overview, manage_schools, toggle_kill_switch, read_jobs, read_audit]
    forbidden_actions: [read_plaintext_school_password, mutate_wallet_directly]
  - role: SCHOOL_OPERATOR
    allowed_actions: [read_overview, manage_schools, approve_school_auth, toggle_kill_switch]
    forbidden_actions: [cross_school_binding_access, read_plaintext_school_password]
  - role: FINANCE_OPERATOR
    allowed_actions: [read_overview, read_orders, reconcile_orders, approve_refund]
    forbidden_actions: [read_school_cookies, mutate_booking_state]
  - role: SECURITY_AUDITOR
    allowed_actions: [read_overview, read_audit]
    forbidden_actions: [mutate_wallet_directly, trigger_booking]
