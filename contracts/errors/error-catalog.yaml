version: 1.0.0
errors:
  - code: CLOUD_AUTH_REQUIRED
    http_status: 401
    retryable: false
    user_action: RECONNECT_XPEACH_BROWSER
    description: Cloud session missing, expired, or revoked.
  - code: SESSION_REPLAY_DETECTED
    http_status: 401
    retryable: false
    user_action: REAUTHENTICATE_ALL
    description: Refresh token reuse detected; entire device session family revoked.
  - code: SSO_UNAVAILABLE
    http_status: 503
    retryable: true
    user_action: KEEP_LOCAL_MODE_OR_RETRY_LATER
    description: XPEACH SSO temporarily unreachable; local features remain unaffected.
  - code: CAMPUS_BINDING_REQUIRED
    http_status: 409
    retryable: false
    user_action: BIND_SCHOOL_IDENTITY
    description: Verified school binding is required for this operation.
  - code: SCHOOL_PERMISSION_REQUIRED
    http_status: 403
    retryable: false
    user_action: USE_MANUAL_OR_MOCK_MODE
    description: School has not granted commercial/third-party automation permission or kill_switch is enabled.
  - code: SCHOOL_CAPABILITY_UNVERIFIED
    http_status: 409
    retryable: false
    user_action: USE_OFFICIAL_WEB_ENTRY
    description: Live write capability is unverified against the school system.
  - code: SCHOOL_AUTH_EXPIRED
    http_status: 401
    retryable: false
    user_action: REAUTHORIZE_SCHOOL_BINDING
    description: Delegated school credential has expired or been revoked.
  - code: CAPTCHA_OR_MFA_REQUIRED
    http_status: 409
    retryable: false
    user_action: COMPLETE_MANUAL_VERIFICATION
    description: School or parcel source requires interactive human verification; automatic bypass is strictly forbidden.
  - code: SCHOOL_RATE_LIMITED
    http_status: 429
    retryable: true
    user_action: WAIT_FOR_RATE_LIMIT_WINDOW
    description: School provider rate limit reached; proxy rotation is forbidden.
  - code: BOOKING_WINDOW_CLOSED
    http_status: 422
    retryable: false
    user_action: SELECT_TARGET_TIME_WITHIN_SCHOOL_WINDOW
    description: Requested target time T falls outside the school's official booking window.
  - code: BOOKING_RESULT_UNKNOWN
    http_status: 202
    retryable: false
    user_action: AWAIT_AUTHORITATIVE_READBACK
    description: Submission timed out; awaiting authoritative read-only verification without blind retry.
  - code: WALLET_INSUFFICIENT
    http_status: 409
    retryable: false
    user_action: RECHARGE_PEACH_WALLET
    description: Insufficient 🍑 balance in XPEACH SSO wallet.
  - code: PAYMENT_RECONCILING
    http_status: 202
    retryable: true
    user_action: AWAIT_LEDGER_RECONCILIATION
    description: Payment settlement with XPEACH SSO is being reconciled idempotently.
  - code: PAYMENT_DUE
    http_status: 409
    retryable: false
    user_action: SETTLE_OUTSTANDING_ORDER
    description: School booking succeeded but post-confirmation 🍑 debit failed due to concurrent spend.
  - code: CONSENT_WITHDRAWN
    http_status: 403
    retryable: false
    user_action: GRANT_CONSENT_IF_DESIRED
    description: User consent was withdrawn; all dependent jobs and credentials have been halted.
  - code: JOB_ALREADY_TERMINAL
    http_status: 409
    retryable: false
    user_action: REFRESH_JOB_STATUS
    description: Reservation job has already reached a terminal state.
  - code: REQUEST_DUPLICATE
    http_status: 200
    retryable: false
    user_action: NONE
    description: Idempotent replay returning original result.
  - code: PARCEL_SOURCE_AUTH_REQUIRED
    http_status: 401
    retryable: false
    user_action: AUTHORIZE_PARCEL_PROVIDER
    description: Independent authorization is required for this parcel platform.
  - code: PARCEL_PROVIDER_NOT_AUTHORIZED
    http_status: 403
    retryable: false
    user_action: USE_MANUAL_IMPORT_OR_MOCK
    description: Provider is marked RESEARCH_ONLY or MANUAL_ONLY in PROVIDER_AUTHORITY_MATRIX.
  - code: PARCEL_CONSENT_REVOKED
    http_status: 403
    retryable: false
    user_action: GRANT_AI_OR_SYNC_CONSENT
    description: Explicit consent for parcel AI or sync was not granted or has been revoked.
  - code: PLUGIN_SIGNATURE_INVALID
    http_status: 400
    retryable: false
    user_action: VERIFY_PLUGIN_PACKAGE_SIGNATURE
    description: Plugin Ed25519 signature or SHA-256 artifact digest verification failed.
  - code: PLUGIN_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: REVIEW_PLUGIN_PERMISSIONS
    description: Plugin attempted an undeclared or forbidden capability via PluginBroker.
  - code: PLUGIN_COMMAND_UNSUPPORTED
    http_status: 400
    retryable: false
    user_action: USE_DECLARED_PLUGIN_COMMAND_TYPE
    description: Plugin command type is missing or outside the declarative open_host_route, open_url, and show_data contract surface; hosts must not fabricate executed command echoes.
  - code: STORAGE_PERSISTENCE_FAILED
    http_status: 503
    retryable: true
    user_action: RETRY_AFTER_STORAGE_RECOVERY
    description: 快照确定未发布，修复存储后按原请求重试。
  - code: STORAGE_COMMIT_UNKNOWN
    http_status: 503
    retryable: true
    user_action: RETRY_WITH_SAME_IDEMPOTENCY_KEY_TO_RECONCILE
    description: 快照提交耐久性待核验；保持原键和原请求，禁止换键重建。
  - code: BAD_REQUEST
    http_status: 400
    retryable: false
    user_action: FIX_REQUEST_FIELDS
    description: Request parameters or JSON body failed schema validation.
  - code: CONFLICT
    http_status: 409
    retryable: false
    user_action: RESOLVE_CONFLICT
    description: Business state conflicts with the current immutable or terminal resource state; resolve the conflict before retrying.
  - code: GROUP_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_GROUP_ID
    description: Group does not exist, is archived, or is not visible in the caller school scope.
  - code: GROUP_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_GROUP_ROLE
    description: Caller lacks the required group owner, admin, member, or self-service authorization.
  - code: SCHOOL_SCOPE_MISMATCH
    http_status: 403
    retryable: false
    user_action: SWITCH_SCHOOL_PROFILE
    description: Requested resource belongs to a different school_id isolation scope.
  - code: GROUP_INVITE_INVALID
    http_status: 404
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code does not exist, was revoked, or does not match the group school scope.
  - code: GROUP_INVITE_EXPIRED
    http_status: 410
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code passed its expiration time.
  - code: GROUP_INVITE_EXHAUSTED
    http_status: 409
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code reached its maximum use count.
  - code: GROUP_ALREADY_MEMBER
    http_status: 409
    retryable: false
    user_action: OPEN_EXISTING_GROUP
    description: User already has an active membership in this group and school scope.
  - code: GROUP_MEMBER_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_MEMBER_ID
    description: Group membership does not exist or is not active in the caller school scope.
  - code: GROUP_LAST_OWNER_REQUIRED
    http_status: 409
    retryable: false
    user_action: TRANSFER_OWNER_BEFORE_LEAVING
    description: The last group owner cannot leave, be removed, or be demoted before ownership transfer.
  - code: AVAILABILITY_BLOCK_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_BUSY_BLOCK_TIME_RANGE
    description: Busy blocks must be aligned to 30-minute boundaries, last at least 30 minutes, use whole 30-minute multiples, be non-overlapping, and contain no titles or free-form notes.
  - code: AVAILABILITY_QUERY_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_AVAILABILITY_QUERY_WINDOW
    description: Availability query window, duration, quorum, member filter, or granularity failed validation; granularity below 30 minutes is forbidden.
  - code: POLL_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_POLL_ID
    description: Poll does not exist or is not visible in the caller school scope.
  - code: POLL_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_GROUP_ROLE
    description: Caller is not an active member allowed to read or vote, or is not the creator/owner/admin allowed to confirm the poll.
  - code: POLL_VOTING_CLOSED
    http_status: 409
    retryable: false
    user_action: CREATE_NEW_POLL_IF_NEEDED
    description: Voting deadline has passed or the poll has otherwise closed; no vote or vote change is accepted.
  - code: POLL_ALREADY_CONFIRMED
    http_status: 409
    retryable: false
    user_action: OPEN_CONFIRMED_GROUP_EVENT
    description: Poll already has a terminal confirmed option and cannot be voted on or confirmed again.
  - code: POLL_OPTION_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_POLL_OPTION_ID
    description: Poll option does not exist within the referenced poll.
  - code: POLL_OPTION_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_POLL_OPTIONS_OR_DEADLINE
    description: Poll options must be distinct quantized time windows and the deadline must be in the future and no later than the earliest option start.
  - code: EMPTY_PARTICIPANTS
    http_status: 400
    retryable: false
    user_action: FIX_LEDGER_SPLIT_PARTICIPANTS
    description: Ledger split requires at least one participant; shared with Android core:ledger validation semantics.
  - code: DUPLICATE_PARTICIPANT
    http_status: 400
    retryable: false
    user_action: REMOVE_DUPLICATE_PARTICIPANT
    description: Ledger split participant identifiers must be unique.
  - code: UNKNOWN_PARTICIPANT
    http_status: 400
    retryable: false
    user_action: CHECK_GROUP_MEMBER_ID
    description: Ledger split rule references a participant who is not an active member of the group scope.
  - code: INVALID_RATIO_WEIGHT
    http_status: 400
    retryable: false
    user_action: FIX_RATIO_WEIGHTS
    description: Ledger ratio weights must be non-negative integers and at least one weight must be positive.
  - code: INVALID_STAY_DAYS
    http_status: 400
    retryable: false
    user_action: FIX_STAY_DAYS
    description: Ledger stay-day weights must be non-negative integers and at least one day count must be positive.
  - code: NO_EFFECTIVE_PARTICIPANTS
    http_status: 400
    retryable: false
    user_action: SELECT_POSITIVE_WEIGHT_PARTICIPANTS
    description: Ledger split rule selects no participant with a positive weight.
  - code: EMPTY_IDENTIFIER
    http_status: 400
    retryable: false
    user_action: FIX_LEDGER_IDENTIFIER
    description: Ledger participant or settlement identifiers must not be empty; shared with Android core:ledger validation semantics.
  - code: INVALID_IDENTIFIER
    http_status: 400
    retryable: false
    user_action: FIX_LEDGER_IDENTIFIER
    description: Ledger opaque identifiers must use printable non-whitespace ASCII so lexicographic tie-breaking is cross-platform stable.
  - code: ARITHMETIC_OVERFLOW
    http_status: 400
    retryable: false
    user_action: REDUCE_AMOUNT_OR_WEIGHTS
    description: Integer-fen ledger arithmetic cannot be represented safely in signed 64-bit fen; silent wrapping is forbidden.
  - code: SAME_SETTLEMENT_PARTIES
    http_status: 400
    retryable: false
    user_action: CHOOSE_DIFFERENT_SETTLEMENT_PARTIES
    description: Settlement debtor and creditor must be different participants.
  - code: NON_POSITIVE_SETTLEMENT_AMOUNT
    http_status: 400
    retryable: false
    user_action: ENTER_POSITIVE_SETTLEMENT_AMOUNT
    description: Settlement amount must be strictly positive integer fen; reverse direction requires swapping debtor and creditor.
  - code: LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_LEDGER_ENTRY_ID
    description: Ledger entry does not exist or is not visible in the caller group and school scope.
  - code: SETTLEMENT_AMOUNT_INVALID
    http_status: 409
    retryable: false
    user_action: REFRESH_BALANCES_AND_ADJUST_AMOUNT
    description: Settlement amount exceeds the debtor negative balance magnitude or creditor positive balance at the pinned balance revision.
  - code: SETTLEMENT_BALANCE_STALE
    http_status: 409
    retryable: false
    user_action: CANCEL_AND_REPROPOSE_SETTLEMENT
    description: Ledger balances changed after this settlement was proposed; cancel it and create a fresh proposal requiring both confirmations again.
  - code: SETTLEMENT_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_SETTLEMENT_ID
    description: Settlement does not exist or is not visible in the caller group and school scope.
  - code: SETTLEMENT_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_SETTLEMENT_AUTHORIZATION
    description: Caller is not an active group member allowed to access or mutate this settlement.
  - code: SETTLEMENT_PARTY_MISMATCH
    http_status: 403
    retryable: false
    user_action: USE_DEBTOR_OR_CREDITOR_ACCOUNT
    description: Only the settlement debtor or creditor can confirm or cancel the settlement.
  - code: SETTLEMENT_INVALID_STATE
    http_status: 409
    retryable: false
    user_action: REFRESH_SETTLEMENT_STATUS
    description: Settlement is already terminal or the requested confirmation/cancellation is invalid for its current two-party state.
  - code: DUTY_ROTA_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_DUTY_ROTA_ID
    description: Duty rota does not exist or is not visible in the caller group and school scope.
  - code: DUTY_TASK_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_DUTY_TASK_ID
    description: Duty task does not exist or is not visible in the caller group and school scope.
  - code: DUTY_SWAP_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_DUTY_SWAP_ID
    description: Duty swap does not exist or is not visible in the caller group and school scope.
  - code: DUTY_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_DUTY_ROLE_OR_ASSIGNMENT
    description: Caller lacks the required duty assignee, target, requester, or group owner/admin authorization.
  - code: DUTY_SCHEDULE_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_DUTY_SCHEDULE_OR_SWAP
    description: Duty rotation members, weekdays, dates, generation horizon, or swap target failed validation.
  - code: DUTY_TASK_INVALID_STATE
    http_status: 409
    retryable: false
    user_action: REFRESH_DUTY_TASK_STATUS
    description: Duty task is not in a state that accepts the requested completion, confirmation, or owner/admin skip transition.
  - code: DUTY_CONFIRMATION_NOT_ALLOWED
    http_status: 403
    retryable: false
    user_action: ASK_ANOTHER_MEMBER_TO_CONFIRM
    description: Duty completion must be confirmed by an active member different from the assignee.
  - code: DUTY_SWAP_INVALID_STATE
    http_status: 409
    retryable: false
    user_action: REFRESH_DUTY_SWAP_STATUS
    description: Duty swap is terminal, the requested accept/reject/cancel action is invalid for its current state, or acceptance is blocked because the referenced task is no longer PENDING.
  - code: REPAIR_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_REPAIR_ID
    description: Repair ticket does not exist or is not visible in the caller group and school scope.
  - code: REPAIR_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_REPAIR_ROLE
    description: Caller lacks reporter, assignee, active member, or group owner/admin authorization for this repair operation.
  - code: REPAIR_INVALID_STATE
    http_status: 409
    retryable: false
    user_action: REFRESH_REPAIR_STATUS
    description: Repair ticket is no longer editable or does not accept the requested operation in its current state.
  - code: REPAIR_STATUS_TRANSITION_INVALID
    http_status: 409
    retryable: false
    user_action: CHECK_REPAIR_STATUS_FLOW
    description: Requested repair status transition violates the explicit OPEN/TRIAGED/IN_PROGRESS/RESOLVED/CLOSED state machine.
  - code: REPAIR_REVIEW_INVALID
    http_status: 409
    retryable: false
    user_action: CHECK_REPAIR_REVIEW_STATE
    description: Repair review is allowed only once by the reporter after RESOLVED; existing reviews cannot be rewritten.
  - code: PLACE_REF_INVALID
    http_status: 400
    retryable: false
    user_action: CHECK_PLACE_REFERENCE
    description: Place reference is not a valid W1-07 Campus Graph stable id or uses an unsupported entity type.
  - code: PLACE_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_CAMPUS_GRAPH_ENTITY
    description: Campus Graph place entity does not exist or is not visible in the caller school scope.
  - code: PLACE_STATUS_REPORT_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_STATUS_OBSERVATION
    description: Place status metric/state combination, observation time, correction link, or note failed validation.
  - code: PLACE_STATUS_REPORT_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_PLACE_REPORT_ID
    description: Place status report does not exist or is not visible in the caller school scope.
  - code: PLACE_STATUS_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_PLACE_STATUS_AUTHORIZATION
    description: Caller lacks the required school-scoped place status read, report, subscription, flag, or moderation authorization.
  - code: PLACE_STATUS_RATE_LIMITED
    http_status: 429
    retryable: true
    user_action: WAIT_FOR_RATE_LIMIT_WINDOW
    description: Place status report or flag rate limit reached; automated spam and retry amplification are forbidden.
  - code: PLACE_STATUS_SUBSCRIPTION_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_PLACE_STATUS_SUBSCRIPTION
    description: Place status subscription target, metric set, bounding box, or school scope failed validation.
  - code: PLACE_STATUS_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_PLACE_STATUS_SUBSCRIPTION
    description: Place status subscription does not exist or does not belong to the authenticated caller.
  - code: PLACE_REPORT_FLAG_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_PLACE_REPORT_FLAG
    description: Place report flag reason or detail failed validation, including duplicate active flags by the same caller.
  - code: PLACE_REPORT_FLAG_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_PLACE_REPORT_FLAG
    description: Place report flag does not exist or is not visible in the reviewer school scope.
  - code: PLACE_REPORT_REVIEW_INVALID
    http_status: 409
    retryable: false
    user_action: REFRESH_PLACE_REPORT_FLAG
    description: Place report flag is already terminal or the requested review action is invalid for its current state.
  - code: FEATURE_NOT_ENABLED
    http_status: 501
    retryable: false
    user_action: NONE
    description: Reserved feature endpoint (decision D2); the feature is contract-only with no implementation, clients must keep the entry hidden or disabled and must not retry or probe for availability.
  - code: CONTENT_PACK_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_CONTENT_PACK_METADATA
    description: Content pack identifier, format/kind combination, version, provenance, compatibility range, or immutable metadata failed validation.
  - code: CONTENT_PACK_SIGNATURE_INVALID
    http_status: 400
    retryable: false
    user_action: VERIFY_CONTENT_PACK_SIGNATURE
    description: Detached Ed25519 signature, trust-root fingerprint, signed payload scheme, or artifact digest verification failed for a school package or data pack.
  - code: CONTENT_PACK_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_CONTENT_PACK_ID
    description: Content pack does not exist or is not visible in the requested school catalog scope.
  - code: CONTENT_PACK_VERSION_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_CONTENT_PACK_VERSION
    description: Content pack version does not exist or is not visible in the requested school catalog scope.
  - code: CONTENT_PACK_VERSION_RETIRED
    http_status: 410
    retryable: false
    user_action: USE_LATEST_PUBLISHED_CONTENT_PACK
    description: Content pack version has been retired; new downloads and new installs are refused while metadata remains auditable.
  - code: CONTENT_PACK_VERSION_CONFLICT
    http_status: 409
    retryable: false
    user_action: CHOOSE_NEW_CONTENT_PACK_VERSION
    description: The immutable pack_id/version already exists with different artifact bytes or metadata; publish a new version instead of rewriting history.
  - code: CONTENT_PACK_SUBMISSION_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_CONTENT_PACK_SUBMISSION
    description: Content pack submission artifact encoding, digest, contribution reference, note, or review metadata failed validation.
  - code: CONTENT_PACK_SUBMISSION_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_CONTENT_PACK_SUBMISSION
    description: Content pack submission does not exist or is not visible to the authenticated caller or reviewer scope.
  - code: CONTENT_PACK_SUBMITTER_CANNOT_REVIEW
    http_status: 403
    retryable: false
    user_action: USE_DISTINCT_REVIEWER_PRINCIPAL
    description: Authenticated reviewer principal is the immutable submitter principal; content pack self-review is forbidden even when the caller holds content_pack.review authorization.
  - code: CONTENT_PACK_REVIEW_INVALID
    http_status: 409
    retryable: false
    user_action: REFRESH_CONTENT_PACK_SUBMISSION
    description: Content pack submission is already terminal or the requested review action is invalid for its current state.
  - code: CONTENT_PACK_REVIEW_REQUIRED
    http_status: 409
    retryable: false
    user_action: COMPLETE_CONTENT_PACK_REVIEW
    description: Only an APPROVED and maintainer-signed submission can be published; pending, changed, rejected, or already-published submissions are not publishable.
  - code: CONTENT_PACK_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_CONTENT_PACK_AUTHORIZATION
    description: Caller lacks the required school-scoped content catalog read, download, submit, review, publish, or retirement authorization.
  - code: CONTENT_PACK_RATE_LIMITED
    http_status: 429
    retryable: true
    user_action: WAIT_FOR_RATE_LIMIT_WINDOW
    description: Content pack submission or artifact download rate limit reached; automated mirror scraping and retry amplification are forbidden.
  - code: CONTENT_PACK_ARTIFACT_TOO_LARGE
    http_status: 413
    retryable: false
    user_action: REDUCE_CONTENT_PACK_ARTIFACT
    description: Content package artifact exceeds the v1 16 MiB ceiling or the base64 review submission body limit.
  - code: SYNC_CONSENT_REQUIRED
    http_status: 403
    retryable: false
    user_action: REVIEW_E2EE_SYNC_CONSENT
    description: E2EE cloud sync requires an active explicit E2EE_CLOUD_SYNC consent; missing, withdrawn, expired, or mismatched consent fails closed before ciphertext upload, download, deletion, or incremental pull.
  - code: SYNC_DEVICE_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_SYNC_DEVICE_REGISTRATION
    description: Sync device registration metadata, protocol version, platform, device id, or user-visible label failed validation; hardware identifiers, secrets, keys, and plaintext payload fields are forbidden.
  - code: SYNC_DEVICE_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: REGISTER_SYNC_DEVICE
    description: Sync device id is not registered for the authenticated cloud user or is not visible in the caller scope.
  - code: SYNC_DEVICE_CONFLICT
    http_status: 409
    retryable: false
    user_action: USE_NEW_SYNC_DEVICE_ID
    description: Sync device id is already bound to a different session family or immutable registration metadata; create a fresh installation UUID instead of reusing or rewriting it.
  - code: SYNC_DEVICE_REVOKED
    http_status: 410
    retryable: false
    user_action: REGISTER_NEW_SYNC_DEVICE_ID
    description: Sync device id was permanently revoked; it cannot be resurrected and cannot read, write, delete, or pull encrypted sync blocks.
  - code: SYNC_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_SYNC_AUTHORIZATION
    description: Caller lacks the required user-scoped encrypted synchronization device or blob permission.
