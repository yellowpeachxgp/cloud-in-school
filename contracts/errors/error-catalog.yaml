version: 1.0.0
errors:
  - code: CLOUD_AUTH_REQUIRED
    http_status: 401
    retryable: false
    user_action: RECONNECT_XPEACH_BROWSER
    description: Cloud session missing, expired, or revoked.
  - code: SESSION_REPLAY_DETECTED
    http_status: 401
    retryable: false
    user_action: REAUTHENTICATE_ALL
    description: Refresh token reuse detected; entire device session family revoked.
  - code: SSO_UNAVAILABLE
    http_status: 503
    retryable: true
    user_action: KEEP_LOCAL_MODE_OR_RETRY_LATER
    description: XPEACH SSO temporarily unreachable; local features remain unaffected.
  - code: CAMPUS_BINDING_REQUIRED
    http_status: 409
    retryable: false
    user_action: BIND_SCHOOL_IDENTITY
    description: Verified school binding is required for this operation.
  - code: SCHOOL_PERMISSION_REQUIRED
    http_status: 403
    retryable: false
    user_action: USE_MANUAL_OR_MOCK_MODE
    description: School has not granted commercial/third-party automation permission or kill_switch is enabled.
  - code: SCHOOL_CAPABILITY_UNVERIFIED
    http_status: 409
    retryable: false
    user_action: USE_OFFICIAL_WEB_ENTRY
    description: Live write capability is unverified against the school system.
  - code: SCHOOL_AUTH_EXPIRED
    http_status: 401
    retryable: false
    user_action: REAUTHORIZE_SCHOOL_BINDING
    description: Delegated school credential has expired or been revoked.
  - code: CAPTCHA_OR_MFA_REQUIRED
    http_status: 409
    retryable: false
    user_action: COMPLETE_MANUAL_VERIFICATION
    description: School or parcel source requires interactive human verification; automatic bypass is strictly forbidden.
  - code: SCHOOL_RATE_LIMITED
    http_status: 429
    retryable: true
    user_action: WAIT_FOR_RATE_LIMIT_WINDOW
    description: School provider rate limit reached; proxy rotation is forbidden.
  - code: BOOKING_WINDOW_CLOSED
    http_status: 422
    retryable: false
    user_action: SELECT_TARGET_TIME_WITHIN_SCHOOL_WINDOW
    description: Requested target time T falls outside the school's official booking window.
  - code: BOOKING_RESULT_UNKNOWN
    http_status: 202
    retryable: false
    user_action: AWAIT_AUTHORITATIVE_READBACK
    description: Submission timed out; awaiting authoritative read-only verification without blind retry.
  - code: WALLET_INSUFFICIENT
    http_status: 409
    retryable: false
    user_action: RECHARGE_PEACH_WALLET
    description: Insufficient 🍑 balance in XPEACH SSO wallet.
  - code: PAYMENT_RECONCILING
    http_status: 202
    retryable: true
    user_action: AWAIT_LEDGER_RECONCILIATION
    description: Payment settlement with XPEACH SSO is being reconciled idempotently.
  - code: PAYMENT_DUE
    http_status: 409
    retryable: false
    user_action: SETTLE_OUTSTANDING_ORDER
    description: School booking succeeded but post-confirmation 🍑 debit failed due to concurrent spend.
  - code: CONSENT_WITHDRAWN
    http_status: 403
    retryable: false
    user_action: GRANT_CONSENT_IF_DESIRED
    description: User consent was withdrawn; all dependent jobs and credentials have been halted.
  - code: JOB_ALREADY_TERMINAL
    http_status: 409
    retryable: false
    user_action: REFRESH_JOB_STATUS
    description: Reservation job has already reached a terminal state.
  - code: REQUEST_DUPLICATE
    http_status: 200
    retryable: false
    user_action: NONE
    description: Idempotent replay returning original result.
  - code: PARCEL_SOURCE_AUTH_REQUIRED
    http_status: 401
    retryable: false
    user_action: AUTHORIZE_PARCEL_PROVIDER
    description: Independent authorization is required for this parcel platform.
  - code: PARCEL_PROVIDER_NOT_AUTHORIZED
    http_status: 403
    retryable: false
    user_action: USE_MANUAL_IMPORT_OR_MOCK
    description: Provider is marked RESEARCH_ONLY or MANUAL_ONLY in PROVIDER_AUTHORITY_MATRIX.
  - code: PARCEL_CONSENT_REVOKED
    http_status: 403
    retryable: false
    user_action: GRANT_AI_OR_SYNC_CONSENT
    description: Explicit consent for parcel AI or sync was not granted or has been revoked.
  - code: PLUGIN_SIGNATURE_INVALID
    http_status: 400
    retryable: false
    user_action: VERIFY_PLUGIN_PACKAGE_SIGNATURE
    description: Plugin Ed25519 signature or SHA-256 artifact digest verification failed.
  - code: PLUGIN_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: REVIEW_PLUGIN_PERMISSIONS
    description: Plugin attempted an undeclared or forbidden capability via PluginBroker.
  - code: STORAGE_PERSISTENCE_FAILED
    http_status: 503
    retryable: true
    user_action: RETRY_AFTER_STORAGE_RECOVERY
    description: 快照确定未发布，修复存储后按原请求重试。
  - code: STORAGE_COMMIT_UNKNOWN
    http_status: 503
    retryable: true
    user_action: RETRY_WITH_SAME_IDEMPOTENCY_KEY_TO_RECONCILE
    description: 快照提交耐久性待核验；保持原键和原请求，禁止换键重建。
  - code: BAD_REQUEST
    http_status: 400
    retryable: false
    user_action: FIX_REQUEST_FIELDS
    description: Request parameters or JSON body failed schema validation.
  - code: GROUP_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_GROUP_ID
    description: Group does not exist, is archived, or is not visible in the caller school scope.
  - code: GROUP_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_GROUP_ROLE
    description: Caller lacks the required group owner, admin, member, or self-service authorization.
  - code: SCHOOL_SCOPE_MISMATCH
    http_status: 403
    retryable: false
    user_action: SWITCH_SCHOOL_PROFILE
    description: Requested resource belongs to a different school_id isolation scope.
  - code: GROUP_INVITE_INVALID
    http_status: 404
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code does not exist, was revoked, or does not match the group school scope.
  - code: GROUP_INVITE_EXPIRED
    http_status: 410
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code passed its expiration time.
  - code: GROUP_INVITE_EXHAUSTED
    http_status: 409
    retryable: false
    user_action: REQUEST_NEW_INVITE
    description: Group invite code reached its maximum use count.
  - code: GROUP_ALREADY_MEMBER
    http_status: 409
    retryable: false
    user_action: OPEN_EXISTING_GROUP
    description: User already has an active membership in this group and school scope.
  - code: GROUP_MEMBER_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_MEMBER_ID
    description: Group membership does not exist or is not active in the caller school scope.
  - code: GROUP_LAST_OWNER_REQUIRED
    http_status: 409
    retryable: false
    user_action: TRANSFER_OWNER_BEFORE_LEAVING
    description: The last group owner cannot leave, be removed, or be demoted before ownership transfer.
  - code: AVAILABILITY_BLOCK_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_BUSY_BLOCK_TIME_RANGE
    description: Busy blocks must be aligned to 30-minute boundaries, last at least 30 minutes, use whole 30-minute multiples, be non-overlapping, and contain no titles or free-form notes.
  - code: AVAILABILITY_QUERY_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_AVAILABILITY_QUERY_WINDOW
    description: Availability query window, duration, quorum, member filter, or granularity failed validation; granularity below 30 minutes is forbidden.
  - code: POLL_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_POLL_ID
    description: Poll does not exist or is not visible in the caller school scope.
  - code: POLL_PERMISSION_DENIED
    http_status: 403
    retryable: false
    user_action: CHECK_GROUP_ROLE
    description: Caller is not an active member allowed to read or vote, or is not the creator/owner/admin allowed to confirm the poll.
  - code: POLL_VOTING_CLOSED
    http_status: 409
    retryable: false
    user_action: CREATE_NEW_POLL_IF_NEEDED
    description: Voting deadline has passed or the poll has otherwise closed; no vote or vote change is accepted.
  - code: POLL_ALREADY_CONFIRMED
    http_status: 409
    retryable: false
    user_action: OPEN_CONFIRMED_GROUP_EVENT
    description: Poll already has a terminal confirmed option and cannot be voted on or confirmed again.
  - code: POLL_OPTION_NOT_FOUND
    http_status: 404
    retryable: false
    user_action: CHECK_POLL_OPTION_ID
    description: Poll option does not exist within the referenced poll.
  - code: POLL_OPTION_INVALID
    http_status: 400
    retryable: false
    user_action: FIX_POLL_OPTIONS_OR_DEADLINE
    description: Poll options must be non-overlapping quantized time windows and the deadline must be in the future and no later than the earliest option start.
