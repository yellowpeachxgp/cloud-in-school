          type: string
          format: date
          description: Date after which clients must display the content as needing re-verification.
        maintainers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 120
            pattern: ^[a-z0-9-]+:[^\s]+$
          description: Maintainer provenance identifiers such as github:name; they are not write-authorization proof.
        verification_level:
          $ref: '#/components/schemas/ContentPackVerificationLevel'
      description: Catalog provenance reviewed before publication. For dis-datapack/v1 it must match the signature-covered embedded metadata exactly; for dis-campus-plugin/v1 it is maintainer-attested catalog metadata outside the legacy artifact signature and clients must not present it as school verification.
    ContentPackSubmissionCreateRequest:
      type: object
      additionalProperties: false
      required: [artifact_format, kind, school_id, pack_id, version, artifact_encoding, artifact_sha256, artifact_base64, contribution_reference, provenance]
      properties:
        artifact_format:
          $ref: '#/components/schemas/ContentPackArtifactFormat'
        kind:
          $ref: '#/components/schemas/ContentPackKind'
        school_id:
          $ref: '#/components/schemas/ContentPackSchoolIdValue'
        pack_id:
          $ref: '#/components/schemas/ContentPackIdValue'
        version:
          $ref: '#/components/schemas/ContentPackVersionValue'
        artifact_encoding:
          type: string
          const: base64
        artifact_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        artifact_base64:
          type: string
          minLength: 16
          maxLength: 23000000
          description: Base64 of the complete artifact. dis-campus-plugin/v1 is the zip school package; dis-datapack/v1 is the unsigned canonical JSON document. The detached signature is produced by the maintainer signing step before publication rather than being trusted from an arbitrary submitter.
        contribution_reference:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
          description: Public contribution PR or equivalent reviewable source link; school intranet and credentialed URLs are forbidden.
        provenance:
          $ref: '#/components/schemas/ContentPackSubmissionProvenance'
        submission_note:
          type: string
          maxLength: 2000
          description: Public-safe reviewer note without credentials, cookies, student numbers, private contact data, or unpublished vulnerability details.
      allOf:
        - if:
            properties:
              artifact_format:
                const: dis-campus-plugin/v1
            required: [artifact_format]
          then:
            properties:
              kind:
                enum: [school-profile, campus-guide]
        - if:
            properties:
              artifact_format:
                const: dis-datapack/v1
            required: [artifact_format]
          then:
            properties:
              kind:
                enum: [procedure-guide, opportunity-catalog, facility-catalog, indoor-graph, period-preset, pharmacy-catalog]
