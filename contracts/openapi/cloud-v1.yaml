    LedgerAmountFen:
      type: integer
      format: int64
      description: Signed integer amount in fen (分). Floating-point values are forbidden; zero is allowed only where the field description explicitly permits it.
    LedgerSplitRuleType:
      type: string
      enum: [EQUAL, SELECTED, RATIOS, STAY_DAYS]
    LedgerRatioWeight:
      type: object
      additionalProperties: false
      required: [member_id, weight]
      properties:
        member_id:
          type: string
          format: uuid
        weight:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: Dimensionless non-negative integer weight. Zero excludes the member; negative values are invalid.
    LedgerStayDays:
      type: object
      additionalProperties: false
      required: [member_id, days]
      properties:
        member_id:
          type: string
          format: uuid
        days:
          type: integer
          format: int64
          minimum: 0
          maximum: 366
          description: Non-negative integer occupied-stay days. Zero excludes the member; negative values are invalid.
    LedgerSplitRule:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/LedgerSplitRuleType'
        participant_member_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Required for SELECTED and forbidden for other types. Every listed member must be an active group member and duplicates are rejected.
        ratio_weights:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerRatioWeight'
          description: Required for RATIOS and forbidden for other types. Unlisted active members have weight zero; at least one positive weight is required.
        stay_days:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerStayDays'
          description: Required for STAY_DAYS and forbidden for other types. Unlisted active members have zero days; at least one positive day count is required.
      allOf:
        - if:
            properties:
              type:
                const: EQUAL
            required: [type]
          then:
            not:
              anyOf:
                - required: [participant_member_ids]
                - required: [ratio_weights]
                - required: [stay_days]
        - if:
            properties:
              type:
                const: SELECTED
            required: [type]
          then:
            required: [participant_member_ids]
            not:
              anyOf:
                - required: [ratio_weights]
                - required: [stay_days]
        - if:
            properties:
              type:
                const: RATIOS
            required: [type]
          then:
            required: [ratio_weights]
            not:
              anyOf:
                - required: [participant_member_ids]
                - required: [stay_days]
        - if:
            properties:
              type:
                const: STAY_DAYS
            required: [type]
          then:
            required: [stay_days]
            not:
              anyOf:
                - required: [participant_member_ids]
                - required: [ratio_weights]
      description: EQUAL splits across all active group members at the time each posting is evaluated; SELECTED equally across explicit members; RATIOS and STAY_DAYS use integer weights. The server applies the Android core:ledger largest-remainder rule exactly. For negative totals the magnitude is allocated by largest remainder first and all resulting shares are then negated; floor is never applied directly to negative rationals.
    LedgerSplitShare:
      type: object
      additionalProperties: false
      required: [participant_member_id, amount_fen]
      properties:
        participant_member_id:
          type: string
          format: uuid
          description: Stable membership-period participant id used for deterministic lexicographic tie-breaking.
        amount_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
    LedgerEntryKind:
      type: string
      enum: [EXPENSE, REFUND, CORRECTION]
    CreateLedgerEntryRequest:
      type: object
      additionalProperties: false
      required: [title, amount_fen, paid_by_member_id, occurred_at, split_rule]
      properties:
        entry_kind:
          type: string
          enum: [EXPENSE, REFUND]
          default: EXPENSE
        title:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: string
          maxLength: 500
        amount_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
          not:
            const: 0
          description: Signed non-zero posting amount in fen. Positive is a group cost paid by paid_by_member_id; negative is a refund or reversal-direction posting.
        paid_by_member_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        split_rule:
          $ref: '#/components/schemas/LedgerSplitRule'
    AmendLedgerEntryRequest:
      type: object
      additionalProperties: false
      required: [reason, amount_fen, paid_by_member_id, occurred_at, split_rule]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 240
          description: User-visible audit reason for the append-only correction.
        title:
          type: string
          minLength: 1
          maxLength: 120
        amount_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
          not:
            const: 0
          description: Signed non-zero delta in fen. A full reversal uses the inverse amount, normally the same payer, and effective participants and weights identical to the original posting; for an original EQUAL rule after membership changed, use SELECTED with the original share participants rather than current-membership EQUAL. Negative deltas are allocated by applying largest remainder to abs(amount_fen), then negating every allocated share.
        paid_by_member_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        split_rule:
          $ref: '#/components/schemas/LedgerSplitRule'
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [entry_id, group_id, school_id, entry_kind, corrects_entry_id, correction_reason, title, note, amount_fen, paid_by_member_id, occurred_at, split_rule, shares, created_by_member_id, created_at]
      properties:
        entry_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        school_id:
          type: string
