    post:
      operationId: queryGroupAvailability
      x-dis-status: active
      x-dis-api-version: v1
      x-dis-compatibility: Additive v1 contract; planned status is explicit and flips to active only with the W4 availability implementation PR.
      x-dis-permissions: [group.availability.read]
