    PlaceStatusDivergence:
      type: object
      additionalProperties: false
      required: [state, report_count, reporter_count, latest_observed_at]
      properties:
        state:
          $ref: '#/components/schemas/PlaceStatusObservationState'
        report_count:
          type: integer
          minimum: 1
          description: Count of unexpired eligible per-reporter-latest reports supporting this state.
        reporter_count:
          type: integer
          minimum: 1
          description: Count of distinct reporters supporting this state after per-reporter deduplication.
        latest_observed_at:
          type: string
          format: date-time
    PlaceStatusProvenance:
      type: object
      additionalProperties: false
      required: [kind, freshness, source_count, latest_reported_at]
      properties:
        kind:
          type: string
          enum: [USER_REPORTED, NO_DATA]
          description: v1 has no official realtime feed; even a note citing an official notice remains user-entered evidence.
        freshness:
          type: string
          enum: [FRESH, STALE, UNKNOWN]
        source_count:
          type: integer
          minimum: 0
        latest_reported_at:
          type: [string, 'null']
          format: date-time
    PlaceStatusView:
      type: object
      additionalProperties: false
      required: [place_ref, school_id, campus_id, place_type, metric, effective_state, divergent_states, active_report_count, reporter_count, latest_reported_at, expires_at, ttl_seconds, aggregation_revision, aggregation_algorithm, unknown_reason, provenance]
      properties:
        place_ref:
          $ref: '#/components/schemas/PlaceRefValue'
        school_id:
          type: string
        campus_id:
          type: string
        place_type:
          $ref: '#/components/schemas/PlaceEntityType'
        metric:
          $ref: '#/components/schemas/PlaceStatusMetric'
        effective_state:
          $ref: '#/components/schemas/PlaceStatusEffectiveState'
        divergent_states:
          type: array
          items:
            $ref: '#/components/schemas/PlaceStatusDivergence'
          description: Every simultaneous unexpired eligible state; clients must render contradictory states together when CONTESTED.
        active_report_count:
          type: integer
          minimum: 0
        reporter_count:
          type: integer
          minimum: 0
        latest_reported_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Latest expires_at across unexpired eligible reports in this aggregate; null when no unexpired eligible report exists. Individual state support can change earlier as each report reaches its own expiry.
        ttl_seconds:
          type: integer
          enum: [1800, 3600, 7200, 86400]
        aggregation_revision:
          type: integer
          minimum: 0
          description: Monotonically increasing revision per school_id+place_ref+metric, starting at 0 for no data and incremented whenever an accepted report/correction, moderation eligibility decision, or TTL expiry recomputation changes the aggregation input or effective view.
        aggregation_algorithm:
          type: string
          const: LATEST_PER_REPORTER_ANY_DIVERGENCE_CONTESTED_V1
        unknown_reason:
          type: [string, 'null']
          enum: [NO_REPORTS, ALL_EXPIRED, ALL_EXCLUDED, null]
          description: 'Present for UNKNOWN: NO_REPORTS, ALL_EXPIRED, or ALL_EXCLUDED.'
        provenance:
          $ref: '#/components/schemas/PlaceStatusProvenance'
