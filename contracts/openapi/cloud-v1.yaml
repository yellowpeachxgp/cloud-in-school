          description: Quote issued (amount, price_version, expires_at, quote_hash)
          content:
            application/json:
              schema:
                $ref: '../schemas/reservation-quote-v1.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 存储未提交或耐久性未知；保持原请求和幂等键等待恢复核验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SchoolIdParam:
      name: schoolId
      in: path
      required: true
      schema:
        type: string
    BindingIdParam:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanIdParam:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobIdParam:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupIdParam:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupInviteIdParam:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupInviteCodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    GroupMemberIdParam:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PollIdParam:
      name: pollId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParcelIdParam:
      name: parcelId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters or schema validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or Cloud session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Operation forbidden by RBAC, consent withdrawal, or school/provider authority matrix
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not owned by authenticated subject
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Business state conflict, duplicate active plan, or insufficient wallet balance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Target time T outside school booking window or invalid rule version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Upstream dependency (e.g., XPEACH SSO or school service) unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ResponseMeta:
      type: object
      required: [request_id, api_version]
      properties:
        request_id:
          type: string
        api_version:
          type: string
          default: v1
        next_cursor:
          type: [string, 'null']
    ErrorDetail:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        user_action:
          type: string
        retryable:
          type: boolean
        detail:
          type: object
    ErrorEnvelope:
      type: object
      required: [ok, code, request_id, error, meta]
      properties:
        ok:
          type: boolean
          const: false
        code:
          type: string
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    HealthResponse:
      type: object
      required: [ok, service, version, timestamp]
      properties:
        ok:
          type: boolean
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required: [ok, db, queue, kms, sso_discovery]
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        queue:
          type: boolean
        kms:
          type: boolean
        sso_discovery:
          type: string
    ActionAckEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MobileAuthStartRequest:
      type: object
      additionalProperties: false
      required: [install_ephemeral_id, code_challenge, code_challenge_method]
      properties:
        install_ephemeral_id:
          type: string
          minLength: 8
          maxLength: 128
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge_method:
          type: string
          enum: [S256]
        device_label:
          type: string
          maxLength: 64
    MobileAuthStartEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
          required: [login_txn, authorize_url, expires_at]
          properties:
            login_txn:
              type: string
            authorize_url:
              type: string
              format: uri
            expires_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MobileTicketExchangeRequest:
      type: object
      additionalProperties: false
      required: [login_txn, app_ticket, code_verifier]
      properties:
        login_txn:
          type: string
        app_ticket:
