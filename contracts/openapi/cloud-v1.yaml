      required: [plugin_id, version, command, executed, output]
      properties:
        plugin_id:
          type: string
        version:
          $ref: '#/components/schemas/PluginVersion'
        command:
          type: string
        executed:
          type: boolean
          const: true
        output:
          type: object
          description: Declarative open_host_route/open_url/show_data output, or host-owned reference-handler output for built-in examples. Third-party plugin artifacts are never executed and request payloads are never echoed as fake execution evidence.
    PluginCommandInvokeEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/PluginCommandInvokeResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    FeatureCatalogEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminOverviewEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [kill_switch, reason]
      properties:
        kill_switch:
          type: boolean
        reason:
          type: string
    AdminApprovalRequest:
      type: object
      additionalProperties: false
      required: [evidence_ref, expires_at, note]
      properties:
        evidence_ref:
          type: string
        expires_at:
          type: string
          format: date-time
        note:
          type: string
    AdminRefundRequest:
      type: object
      additionalProperties: false
      required: [amount_micropeach]
      properties:
        amount_micropeach:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 200
    AdminQuickRefundRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
    RefundRequest:
      type: object
      additionalProperties: false
      required: [id, order_id, cloud_user_id, amount_micropeach, reason, request_hash, status, created_by, created_at, expires_at, approved_by, approved_at, executed_at, result_error]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        cloud_user_id:
          type: string
        amount_micropeach:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 200
        request_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, EXECUTING, RESULT_UNKNOWN, REFUNDED, EXPIRED, FAILED]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        approved_by:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
        executed_at:
          type: [string, 'null']
          format: date-time
        result_error:
          type: [string, 'null']
    RefundRequestEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [refund_request]
          properties:
            refund_request:
              $ref: '#/components/schemas/RefundRequest'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RefundLegacyReconcileQueueItem:
      type: object
      additionalProperties: false
      required: [order_id, event_key, status, attempt_count, created_at, updated_at]
      properties:
        order_id:
          type: string
          format: uuid
        event_key:
          type: string
        status:
          type: string
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RefundRequestListEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [refund_requests, legacy_reconcile_queue]
          properties:
            refund_requests:
              type: array
              items:
                $ref: '#/components/schemas/RefundRequest'
            legacy_reconcile_queue:
              type: array
              items:
                $ref: '#/components/schemas/RefundLegacyReconcileQueueItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RefundExecutionEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [refund_request, order]
          properties:
            refund_request:
              $ref: '#/components/schemas/RefundRequest'
            order:
              type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuditEventListEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SyncDeviceIdValue:
      type: string
      format: uuid
      description: Fresh client-generated installation UUID. It is not a hardware serial, IMEI, SSAID, push token, or stable operating-system identifier.
    SyncDevicePlatform:
      type: string
      enum: [ANDROID]
      description: v1 has an Android implementation only. Additional platforms require a backwards-compatible contract revision rather than informal free text.
    SyncDeviceStatus:
      type: string
      enum: [ACTIVE, REVOKED]
    SyncDeviceRevocationReason:
      type: string
      enum: [USER_REMOVED, LOST_OR_STOLEN, SECURITY_REKEY]
    RegisterSyncDeviceRequest:
      type: object
      additionalProperties: false
      required: [consent_id, platform, sync_protocol_version]
      properties:
        consent_id:
          type: string
          format: uuid
          description: Active consent record whose purpose is E2EE_CLOUD_SYNC. The linked consent document must disclose ciphertext-only server storage and cross-device sync processing.
        device_label:
          type: string
          minLength: 1
          maxLength: 80
          description: Optional user-chosen management label. Clients must not auto-populate precise hardware serials, phone numbers, student numbers, or device-location text.
        platform:
          $ref: '#/components/schemas/SyncDevicePlatform'
        sync_protocol_version:
          type: integer
          const: 1
      description: Immutable registration metadata. No encryption key, private key, password, session token, hardware identifier, or plaintext sync payload field is permitted.
    RevokeSyncDeviceRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/SyncDeviceRevocationReason'
    SyncDevice:
      type: object
      additionalProperties: false
      required: [device_id, status, device_label, platform, sync_protocol_version, registered_at, revoked_at, revocation_reason, last_seen_at]
      properties:
        device_id:
          $ref: '#/components/schemas/SyncDeviceIdValue'
        status:
          $ref: '#/components/schemas/SyncDeviceStatus'
        device_label:
          type: [string, 'null']
          maxLength: 80
        platform:
          $ref: '#/components/schemas/SyncDevicePlatform'
        sync_protocol_version:
          type: integer
          const: 1
        registered_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revocation_reason:
          anyOf:
            - $ref: '#/components/schemas/SyncDeviceRevocationReason'
            - type: 'null'
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: Last time this device was accepted for a sync read or write. It is operational metadata only and is never derived from plaintext payload inspection.
    SyncDeviceEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/SyncDevice'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SyncDeviceListEnvelope:
      type: object
      required: [ok, code, request_id, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        code:
          type: string
        request_id:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SyncDevice'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
