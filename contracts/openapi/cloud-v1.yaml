    ContentPackArtifactFormat:
      type: string
      enum: [dis-campus-plugin/v1, dis-datapack/v1]
      description: >-
        Signed artifact family. For CT-06 transport, dis-campus-plugin/v1 is a ZIP containing root manifest.json plus exactly the payload files declared by the legacy manifest under the existing profile/, assets/, or rules/ path policy; the detached signature is never a ZIP entry. Implementations reject extra, duplicate, encrypted, zip-slip, absolute, backslash, NUL, ZIP64, or multi-disk entries and enforce the legacy 512-entry, 4 MiB-per-file, and 16 MiB-uncompressed-total ceilings. dis-datapack/v1 is the canonical JSON data pack format whose schema lives at contracts/schemas/dis-datapack-v1.schema.json. Exact-byte canonicality is mandatory for dis-datapack/v1: implementations must parse the exact UTF-8 artifact bytes and require bytes == RFC8785(parse(bytes)) before acceptance, so semantically equivalent whitespace, key-order, string-escape, or number variants are rejected rather than normalized into acceptance. Android's existing Json.canonical BigDecimal normalization is not RFC 8785/JCS and must not be reused for this datapack canonicalizer.
    ContentPackKind:
      type: string
      enum: [school-profile, campus-guide, procedure-guide, opportunity-catalog, facility-catalog, indoor-graph, period-preset, pharmacy-catalog]
      description: school-profile/campus-guide are valid only for dis-campus-plugin/v1. The six guide/catalog/graph/preset kinds are valid only for dis-datapack/v1. Implementations must reject mismatched combinations instead of coercing them.
    ContentPackVerificationLevel:
      type: string
      enum: [UNVERIFIED, SOURCE_CONFIRMED, MOCK_TESTED, DEVICE_TESTED, SCHOOL_VERIFIED, DISTRIBUTION_READY]
      description: Evidence level copied from signed content metadata. UNVERIFIED is explicit for maintainer/agent-compiled public-source data under D1; SCHOOL_VERIFIED and DEVICE_TESTED require matching evidence and are never implied by catalog presence.
    ContentPackLifecycleStatus:
      type: string
      enum: [PUBLISHED, RETIRED]
    ContentPackSubmissionStatus:
      type: string
      enum: [PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, PUBLISHED]
    ContentPackReviewAction:
      type: string
      enum: [APPROVE, REQUEST_CHANGES, REJECT]
    ContentPackRetireReason:
      type: string
      enum: [INCORRECT_DATA, OUTDATED, SECURITY, LICENSE, MAINTAINER_REQUEST, OTHER]
    ContentPackSchoolIdValue:
      type: string
      minLength: 2
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9_-]{1,63}$
      description: Lowercase school catalog isolation scope. Dots are forbidden, matching the PluginSchoolId/Android SchoolId direction, so a pack_id first dot-separated segment can unambiguously equal the complete school scope; for dis-datapack/v1 it must also match the artifact embedded schoolId.
    ContentPackIdValue:
      type: string
      minLength: 3
      maxLength: 128
      pattern: ^[a-z0-9][a-z0-9._-]{2,127}$
      description: Stable package identifier, normally <schoolId>.<topic>; it contains no slash and must be percent-encoded when used in one path segment. For dis-datapack/v1 the first dot-separated segment must equal the complete no-dot school_id; legacy dis-campus-plugin/v1 keeps its existing package-id compatibility rules.
    ContentPackVersionValue:
      type: string
      pattern: ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(-[0-9A-Za-z][0-9A-Za-z.-]{0,31})?$
      description: MAJOR.MINOR.PATCH[-prerelease] compatible with the existing school-package version comparator.
    ContentPackSource:
      type: object
      additionalProperties: false
      required: [url, title, retrieved_at]
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
          description: Publicly accessible HTTPS source URL; credentialed school intranet URLs are not acceptable catalog provenance.
        title:
          type: string
          minLength: 1
          maxLength: 200
        retrieved_at:
          type: string
          format: date
    ContentPackSignature:
      type: object
      additionalProperties: false
      required: [algorithm, scheme, public_key_fingerprint, value, signed_payload_sha256]
      properties:
        algorithm:
          type: string
          const: Ed25519
        scheme:
          type: string
          enum: [DIS_CAMPUS_PLUGIN_MANIFEST_FILES_V1, DIS_DATAPACK_CANONICAL_JSON_SHA256_V1]
          description: DIS_CAMPUS_PLUGIN_MANIFEST_FILES_V1 is the existing school-package payload (format line, canonical manifest digest, files digest). DIS_DATAPACK_CANONICAL_JSON_SHA256_V1 signs UTF-8 text dis-datapack/v1 + LF + lowercase SHA-256 of the RFC-8785-canonical JSON document + LF. Because exact-byte canonicality is mandatory for dis-datapack/v1, that canonical digest must be the SHA-256 of the exact artifact bytes; semantic equivalence is not sufficient. Implementations must not invent a third interpretation.
        public_key_fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 fingerprint of the raw Ed25519 public key. Clients compare it with a pinned publisher trust root; catalog data alone is not a trust root.
        value:
          type: string
          pattern: ^[A-Za-z0-9+/]{86}==$
          description: Base64-encoded detached 64-byte Ed25519 signature.
        signed_payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the exact payload bytes that were signed, published for transparency; verifiers still recompute the payload from the artifact.
    ContentPackSummary:
      type: object
      additionalProperties: false
      required: [pack_id, school_id, kind, artifact_format, title, latest_version, verification_level, review_by, source_count, updated_at]
      properties:
        pack_id:
          $ref: '#/components/schemas/ContentPackIdValue'
        school_id:
          $ref: '#/components/schemas/ContentPackSchoolIdValue'
        kind:
          $ref: '#/components/schemas/ContentPackKind'
        artifact_format:
          $ref: '#/components/schemas/ContentPackArtifactFormat'
        title:
          type: string
          minLength: 1
          maxLength: 120
        latest_version:
          type:
            - string
            - 'null'
          description: Highest non-retired published version visible to the caller; null only when include_retired exposes a fully retired package.
        verification_level:
          $ref: '#/components/schemas/ContentPackVerificationLevel'
        review_by:
          type: string
          format: date
          description: Date after which clients must display the content as needing re-verification; catalog presence never means school verification.
        source_count:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    ContentPackVersion:
      type: object
      additionalProperties: false
      required: [pack_id, school_id, kind, artifact_format, version, lifecycle_status, artifact_sha256, artifact_size_bytes, signature, verification_level, verified_at, review_by, sources, maintainers, published_at, published_by_alias, submission_id, download_path, min_host_api, min_app_version_code, release_note, retired_at, retirement_reason, retirement_detail]
      properties:
        pack_id:
          $ref: '#/components/schemas/ContentPackIdValue'
        school_id:
          $ref: '#/components/schemas/ContentPackSchoolIdValue'
        kind:
          $ref: '#/components/schemas/ContentPackKind'
        artifact_format:
          $ref: '#/components/schemas/ContentPackArtifactFormat'
        version:
          $ref: '#/components/schemas/ContentPackVersionValue'
        lifecycle_status:
          $ref: '#/components/schemas/ContentPackLifecycleStatus'
        artifact_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Lowercase SHA-256 of the exact downloadable artifact bytes.
        artifact_size_bytes:
          type: integer
          minimum: 1
          maximum: 16777216
          description: v1 reuses the existing school-package 16 MiB ceiling for zip school packages and canonical JSON data packs.
        signature:
          $ref: '#/components/schemas/ContentPackSignature'
        verification_level:
          $ref: '#/components/schemas/ContentPackVerificationLevel'
        verified_at:
          type: string
          format: date
        review_by:
          type: string
          format: date
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentPackSource'
        maintainers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 120
          description: Maintainer provenance identifiers such as github:name; they are not write-authorization proof.
        published_at:
          type: string
          format: date-time
        published_by_alias:
          type: string
          minLength: 2
          maxLength: 80
          description: Pseudonymous operator alias; never a cloud user UUID, SSO username, student number, or real-name staff identifier.
        submission_id:
          type: string
          format: uuid
        download_path:
          type: string
          pattern: ^/api/v1/content-packs/[^\s]+/versions/[^\s]+/download$
          description: Concrete percent-encoded relative download path for this immutable version.
        min_host_api:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 2147483647
        min_app_version_code:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 2147483647
        release_note:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Immutable public-safe catalog release note supplied at publication; null when omitted. It never alters the signed artifact or provenance.
        retired_at:
          type:
            - string
            - 'null'
          format: date-time
        retirement_reason:
          type:
            - string
            - 'null'
          enum: [INCORRECT_DATA, OUTDATED, SECURITY, LICENSE, MAINTAINER_REQUEST, OTHER, null]
        retirement_detail:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Public-safe reason text without reporter identity, credentials, student numbers, or unmitigated vulnerability details.
