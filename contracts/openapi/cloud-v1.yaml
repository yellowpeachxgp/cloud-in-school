    LedgerMemberBalance:
      type: object
      additionalProperties: false
      required: [member_id, posting_credit_fen, share_cost_fen, outbound_settlement_fen, inbound_settlement_fen, balance_fen]
      properties:
        member_id:
          type: string
          format: uuid
        posting_credit_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
          description: Sum of signed amount_fen for postings where this member is payer.
        share_cost_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
          description: Sum of deterministic shares allocated to this member.
        outbound_settlement_fen:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed out-of-band settlement amounts for which this member is debtor; increases balance_fen because recorded debt is reduced.
        inbound_settlement_fen:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed out-of-band settlement amounts for which this member is creditor; decreases balance_fen because recorded receivable is reduced.
        balance_fen:
          $ref: '#/components/schemas/LedgerAmountFen'
          description: posting_credit_fen - share_cost_fen + outbound_settlement_fen - inbound_settlement_fen. Positive means the member is owed; negative means the member owes.
    LedgerBalanceResult:
      type: object
      additionalProperties: false
      required: [group_id, school_id, balance_revision, generated_at, zero_sum_check_fen, members]
      properties:
        group_id:
          type: string
          format: uuid
        school_id:
          type: string
        balance_revision:
          type: integer
          minimum: 0
          description: Monotonic group ledger revision incremented by postings, corrections, and confirmed settlements. Settlement proposals pin this revision.
        generated_at:
          type: string
          format: date-time
        zero_sum_check_fen:
          type: integer
          format: int64
          const: 0
          description: Sum of all member balance_fen values; must always be exactly zero.
        members:
          type: array
          items:
            $ref: '#/components/schemas/LedgerMemberBalance'
