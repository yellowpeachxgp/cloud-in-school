          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Uniform reserved endpoint response (decision D2); the feature is not enabled, nothing is persisted, and every request receives the identical FEATURE_NOT_ENABLED envelope regardless of authentication state, query parameters, headers, or request body
      content:
        application/json:
          schema:
