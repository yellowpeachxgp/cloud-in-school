      x-dis-idempotency: required
      tags: [polls]
      security:
        - bearerAuth: []
      summary: Cast or change the caller's single-choice vote before the voting deadline
      description: |
        One active membership has at most one vote per poll. Reusing the same Idempotency-Key replays the original accepted vote; a deliberate vote change uses a new key and is allowed only while the poll remains OPEN. Confirmed or deadline-closed polls never accept further changes.
