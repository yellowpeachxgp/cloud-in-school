      summary: Find candidate time windows in which at least N selected group members are represented as free
      description: |
        The query is privacy-minimizing: it returns aggregate candidate windows and per-member AVAILABLE/BUSY/UNKNOWN states, never raw busy blocks. Members whose sharing_level is NONE, whose share expired, or who left the group are UNKNOWN and never count as available. To query all active members, pass the active member count as min_attendees; unknown members naturally prevent a full-consensus candidate. Candidate boundaries use granularity_minutes, which must be at least 30 minutes.
