      properties:
        blocks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AvailabilityBlock'
          description: Replacement set of busy intervals. Overlapping or non-normalized blocks are rejected; titles, reasons, locations, and notes are outside this schema by design.
        ttl_seconds:
          type: integer
          minimum: 1800
          maximum: 7776000
          description: Share lifetime in seconds (30 minutes through 90 days). The server computes expires_at and must not retain expired blocks.
