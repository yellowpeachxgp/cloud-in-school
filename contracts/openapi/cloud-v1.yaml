    PlaceEntityType:
      type: string
      enum: [campus, building, floor, room, facility, entrance, indoor_node]
      description: W1-07 Campus Graph entity type segment. A classroom is a room; facility and entrance are distinct stable entity types.
    PlaceRefValue:
      type: string
      minLength: 11
      maxLength: 256
      pattern: '^[A-Za-z0-9_-]{1,128}/[A-Za-z0-9_-]{1,128}/(campus|building|floor|room|facility|entrance|indoor_node)/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      example: haut/lianhuajie/room/5-111
      description: Stable Campus Graph identity <schoolId>/<campusId>/<type>/<slug>; display names are never identity segments.
    PlaceStatusMetric:
      type: string
      enum: [ACCESS, OPERATION, OCCUPANCY, SAFETY]
      description: ACCESS=open/closed/restricted; OPERATION=working/degraded/out-of-service; OCCUPANCY=quiet/moderate/crowded/full; SAFETY=safe/hazard. v1 TTL is fixed by metric.
    PlaceStatusObservationState:
      type: string
      enum: [OPEN, CLOSED, RESTRICTED, WORKING, DEGRADED, OUT_OF_SERVICE, QUIET, MODERATE, CROWDED, FULL, SAFE, HAZARD]
    PlaceStatusEffectiveState:
      type: string
      enum: [OPEN, CLOSED, RESTRICTED, WORKING, DEGRADED, OUT_OF_SERVICE, QUIET, MODERATE, CROWDED, FULL, SAFE, HAZARD, CONTESTED, UNKNOWN]
    PlaceStatusReportKind:
      type: string
      enum: [OBSERVATION, CORRECTION]
    CreatePlaceStatusReportRequest:
      type: object
      additionalProperties: false
      required: [metric, state, observed_at, report_kind]
      properties:
        metric:
          $ref: '#/components/schemas/PlaceStatusMetric'
        state:
          $ref: '#/components/schemas/PlaceStatusObservationState'
        observed_at:
          type: string
          format: date-time
          description: Observation time. The server rejects timestamps more than five minutes in the future or already older than the metric TTL at receipt; expires_at is observed_at + ttl_seconds, never reported_at + ttl_seconds.
        report_kind:
          $ref: '#/components/schemas/PlaceStatusReportKind'
        corrects_report_id:
          type: string
          format: uuid
          description: Required for CORRECTION and forbidden for OBSERVATION. The target must be visible, in the same school scope, and for the same place+metric; it is never rewritten or treated as an authority override.
        note:
          type: string
          maxLength: 280
          description: Short evidence note. Clients must warn against entering student numbers, phone numbers, occupants, or other PII.
      allOf:
        - if:
            properties:
              metric:
                const: ACCESS
            required: [metric]
          then:
            properties:
              state:
                enum: [OPEN, CLOSED, RESTRICTED]
        - if:
            properties:
              metric:
                const: OPERATION
            required: [metric]
          then:
            properties:
              state:
                enum: [WORKING, DEGRADED, OUT_OF_SERVICE]
        - if:
            properties:
              metric:
                const: OCCUPANCY
            required: [metric]
          then:
            properties:
              state:
                enum: [QUIET, MODERATE, CROWDED, FULL]
        - if:
            properties:
              metric:
                const: SAFETY
            required: [metric]
          then:
            properties:
              state:
                enum: [SAFE, HAZARD]
        - if:
            properties:
              report_kind:
                const: CORRECTION
            required: [report_kind]
          then:
            required: [corrects_report_id]
        - if:
            properties:
              report_kind:
                const: OBSERVATION
            required: [report_kind]
          then:
            not:
              required: [corrects_report_id]
      example:
        metric: OCCUPANCY
        state: CROWDED
        observed_at: '2026-11-27T12:20:00+08:00'
        report_kind: OBSERVATION
        note: 自习座位基本坐满
    PlaceStatusModerationState:
      type: string
      enum: [VISIBLE, UNDER_REVIEW, EXCLUDED_INCORRECT, EXCLUDED_ABUSE]
    PlaceStatusReport:
      type: object
      additionalProperties: false
      required: [report_id, place_ref, school_id, campus_id, place_type, metric, state, observed_at, reported_at, expires_at, ttl_seconds, report_kind, corrects_report_id, corrected_by_report_ids, reporter_alias, is_own_report, note, moderation_state, aggregation_eligible]
      properties:
        report_id:
          type: string
          format: uuid
        place_ref:
          $ref: '#/components/schemas/PlaceRefValue'
        school_id:
          type: string
        campus_id:
          type: string
        place_type:
          $ref: '#/components/schemas/PlaceEntityType'
        metric:
          $ref: '#/components/schemas/PlaceStatusMetric'
        state:
          $ref: '#/components/schemas/PlaceStatusObservationState'
        observed_at:
          type: string
          format: date-time
        reported_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Server-computed exactly as observed_at + ttl_seconds. Data after this instant is history, never current truth.
        ttl_seconds:
          type: integer
          enum: [1800, 3600, 7200, 86400]
          description: 'Fixed v1 metric TTL: OCCUPANCY=1800, SAFETY=3600, ACCESS=7200, OPERATION=86400.'
        report_kind:
          $ref: '#/components/schemas/PlaceStatusReportKind'
        corrects_report_id:
          type: [string, 'null']
          format: uuid
        corrected_by_report_ids:
          type: array
          items:
            type: string
            format: uuid
        reporter_alias:
          type: string
          minLength: 1
          maxLength: 80
          description: Per-school pseudonymous alias; never SSO username, student number, phone number, or cloud user UUID.
        is_own_report:
          type: boolean
        note:
          type: [string, 'null']
          maxLength: 280
        moderation_state:
          $ref: '#/components/schemas/PlaceStatusModerationState'
        aggregation_eligible:
          type: boolean
