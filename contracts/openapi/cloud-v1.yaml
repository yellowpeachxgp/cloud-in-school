    PluginSchoolId:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9][a-z0-9_-]{1,31}$'
      description: Lowercase school isolation scope. The host trims and lowercases this identifier before resolving the account/school plugin installation.
    PluginPermissionId:
      type: string
      enum:
        - network.request
        - account.session
        - storage.scoped
        - notification.send
        - location.coarse
        - library.booking.read
        - library.booking.create
        - parcel.read
        - parcel.ai.invoke
        - ui.slot.render
        - parcel.write.import
    PluginVersion:
      type: string
      pattern: '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(-[0-9A-Za-z][0-9A-Za-z.-]{0,31})?$'
    PluginInstallRequest:
      type: object
      additionalProperties: false
      required: [manifest]
      properties:
        manifest:
          type: object
          description: Signed snake_case dis-extension/v2 runtime manifest. manifest.signature.value_base64 is the authoritative signature evidence; no detached signature field is part of this contract. Full manifest-schema convergence into contracts/schemas/plugin-extension-v2.schema.json remains a separately tracked W6 contract-surface slice.
        artifact_map:
          type: object
          additionalProperties:
            type: string
          description: Canonical artifact payload map keyed by the exact safe relative paths declared in manifest.entry_artifacts. JSON string values are interpreted as UTF-8 artifact content before SHA-256 verification; the host persists the verified bytes in its own Base64 storage form.
        public_key_base64:
          type: string
          minLength: 60
          maxLength: 60
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          description: Optional client consistency proof encoded as the base64 Ed25519 SPKI DER public key for the host-configured publisher trust root. It is never trust input, never overrides the publisher/key_id trust root, and is not required.
        school_id:
          $ref: '#/components/schemas/PluginSchoolId'
    PluginLifecycleRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [ENABLE, DISABLE, REVOKE_PERMISSION, ROLLBACK, UNINSTALL]
        target_version:
          $ref: '#/components/schemas/PluginVersion'
          description: Optional explicit rollback target for action=ROLLBACK; when omitted, the installation previous_version is used. Other actions do not consume this field.
        permission:
          $ref: '#/components/schemas/PluginPermissionId'
          description: Permission grant to revoke for action=REVOKE_PERMISSION; it must be declared by the active plugin version.
        scope:
          type: string
          enum: [installation, global]
          default: installation
          description: installation affects only the caller account/school installation. global is reserved for the admin/operator kill-switch form of DISABLE.
        admin_kill_switch:
          type: boolean
          default: false
          description: When true with action DISABLE, an admin/operator globally disables the plugin and existing installations. scope=global selects the same form; ordinary users cannot use either form.
        school_id:
          $ref: '#/components/schemas/PluginSchoolId'
        reason:
          type: string
          description: Optional audit reason for revocation, uninstall, or administrative kill-switch isolation.
      allOf:
        - if:
            properties:
              action:
                const: REVOKE_PERMISSION
            required: [action]
          then:
            required: [permission]
        - if:
            properties:
              scope:
                const: global
            required: [scope]
          then:
            properties:
              action:
                const: DISABLE
        - if:
            properties:
              admin_kill_switch:
                const: true
            required: [admin_kill_switch]
          then:
            properties:
              action:
                const: DISABLE
    PluginInstallation:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - cloud_user_id
        - user_id
        - school_id
        - plugin_id
        - active_version
        - previous_version
        - pending_version
        - pending_permissions
        - status
        - granted_permissions
        - installed_at
        - updated_at
