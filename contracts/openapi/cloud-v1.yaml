      x-dis-compatibility: Additive v1 contract; planned status is explicit and flips to active only with the W4 availability implementation PR.
      x-dis-permissions: [group.availability.write]
      x-dis-error-codes: [BAD_REQUEST, CLOUD_AUTH_REQUIRED, CAMPUS_BINDING_REQUIRED, SCHOOL_SCOPE_MISMATCH, GROUP_NOT_FOUND, GROUP_PERMISSION_DENIED, AVAILABILITY_BLOCK_INVALID, REQUEST_DUPLICATE, STORAGE_PERSISTENCE_FAILED, STORAGE_COMMIT_UNKNOWN]
      x-dis-idempotency: required
      x-dis-events: [group.availability.updated, group.event.conflict_detected]
      tags: [availability]
      security:
        - bearerAuth: []
      summary: Replace the caller's quantized busy blocks in a group with a TTL-bounded share
      description: |
        Only time blocks are stored: no event titles, reasons, locations, or free-form notes. Each block must start and end on a 30-minute boundary, last at least 30 minutes, and have a duration that is a whole multiple of 30 minutes. Blocks are interpreted as busy; absence of a block is the member's represented free time. The upsert is an explicit self-service opt-in and sets the caller membership sharing_level to BUSY_BLOCKS_30MIN. The server computes expires_at from ttl_seconds; expiration makes the member UNKNOWN immediately. If a newly shared block overlaps a confirmed group event, the backend emits group.event.conflict_detected for user review and never reschedules automatically.
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceGroupAvailabilityRequest'
      responses:
        '200':
          description: Busy-block share replaced, or the durable idempotent replay of the original replacement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAvailabilityShareEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
