        pre_quarantine_status:
          type: string
          enum: [ENABLED, DISABLED, PENDING_PERMISSION_REVIEW]
          description: Lifecycle state captured before restart-time package integrity isolation; present only for QUARANTINED installations.
        quarantine_reason:
          type: string
          enum: [ACTIVE_PACKAGE_COMPROMISED]
          description: Machine-readable reason a QUARANTINED installation was isolated after persisted package verification failed.
        quarantined_at:
          type: string
          format: date-time
        installed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PluginUninstallResult:
