    GroupAvailabilityQueryRequest:
      type: object
      additionalProperties: false
      required: [window_start_at, window_end_at, duration_minutes, min_attendees]
      properties:
        window_start_at:
          type: string
          format: date-time
          description: Inclusive search window start; must be aligned to granularity_minutes.
        window_end_at:
          type: string
          format: date-time
          description: Exclusive search window end; must be after window_start_at and aligned to granularity_minutes.
        duration_minutes:
          type: integer
          minimum: 30
          multipleOf: 30
          description: Required contiguous candidate duration in minutes.
        min_attendees:
          type: integer
          minimum: 1
          description: Minimum number of AVAILABLE members. Passing the active group member count requests an all-member consensus; UNKNOWN members do not count.
        member_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Optional active member-dimension filter. When omitted, all active members in the group are evaluated; LEFT or REMOVED memberships are never included.
        granularity_minutes:
          type: integer
          minimum: 30
          multipleOf: 30
          default: 30
          description: Candidate grid granularity. Values below 30 minutes are forbidden to preserve the privacy-minimizing sharing granularity.
    AvailabilityMemberStatus:
      type: string
      enum: [AVAILABLE, BUSY, UNKNOWN]
      description: AVAILABLE means the member has an unexpired BUSY_BLOCKS_30MIN share and no overlapping shared busy block; BUSY means such a block overlaps; UNKNOWN means sharing is absent, withdrawn, expired, or otherwise insufficient and must never be treated as free.
    GroupAvailabilityMemberResult:
      type: object
      additionalProperties: false
      required: [member_id, status, sharing_level]
      properties:
        member_id:
          type: string
          format: uuid
        status:
