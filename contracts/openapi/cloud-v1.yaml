  /api/v1/admin/orders/{orderId}/refund-requests:
    post:
      operationId: createRefundRequest
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Create an immutable dual-person refund request (PENDING_APPROVAL, 24h expiry)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundRequest'
      responses:
        '202':
          description: Refund request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/refund-requests:
    get:
      operationId: listRefundRequests
      tags: [admin]
      security:
        - bearerAuth: []
      summary: List dual-approval refund requests and their lifecycle status
      responses:
        '200':
          description: Refund requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/refund-requests/{requestId}/approve:
    post:
      operationId: approveRefundRequest
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Approve a pending refund request as the DISTINCT second authenticated finance admin (self-approval rejected)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/refund-requests/{requestId}/execute:
    post:
      operationId: executeRefundRequest
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Execute an approved refund request with immutable-hash and role re-verification (idempotent event key)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund executed or idempotently converged (order REFUNDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundExecutionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/credential-integrity:
    get:
      operationId: auditCredentialIntegrity
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Read-only audit of binding to credential_ref integrity (shared/mismatched/missing refs; no plaintext)
      responses:
        '200':
          description: Credential integrity report
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/finance-worker/metrics:
    get:
      operationId: getFinanceWorkerMetrics
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Finance retry worker metrics (pending debits, backlog age, manual-review queue, last run)
      responses:
        '200':
          description: Finance worker metrics
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/orders/{orderId}/refund-reconcile:
    post:
      operationId: reconcileLegacyRefund
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Read-only reconcile of a legacy (pre-dual-approval) refund operation via its original idempotency key — never dispatches a new write
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Legacy refund reconciled or still unresolved
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/reservation-quote:
    get:
      operationId: getReservationQuote
      tags: [reservations]
      security:
        - bearerAuth: []
      summary: Issue a short-lived server price quote to pin at plan creation
      responses:
        '200':
          description: Quote issued (amount, price_version, expires_at, quote_hash)
          content:
            application/json:
              schema:
                $ref: '../schemas/reservation-quote-v1.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 存储未提交或耐久性未知；保持原请求和幂等键等待恢复核验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SchoolIdParam:
      name: schoolId
      in: path
      required: true
      schema:
        type: string
    BindingIdParam:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanIdParam:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobIdParam:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupIdParam:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupInviteIdParam:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupInviteCodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    GroupMemberIdParam:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PollIdParam:
      name: pollId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LedgerEntryIdParam:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SettlementIdParam:
      name: settlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RotaIdParam:
      name: rotaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DutyTaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DutySwapIdParam:
      name: swapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RepairIdParam:
      name: repairId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceRefParam:
      name: placeRef
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlaceRefValue'
      description: W1-07 Campus Graph stable id percent-encoded as one path segment.
    PlaceReportIdParam:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceReportFlagIdParam:
      name: flagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceStatusSubscriptionIdParam:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParcelIdParam:
      name: parcelId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters or schema validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or Cloud session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Operation forbidden by RBAC, consent withdrawal, or school/provider authority matrix
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not owned by authenticated subject
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Business state conflict, duplicate active plan, or insufficient wallet balance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Target time T outside school booking window or invalid rule version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Upstream dependency (e.g., XPEACH SSO or school service) unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ResponseMeta:
      type: object
      required: [request_id, api_version]
