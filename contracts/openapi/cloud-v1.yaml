      summary: Query TTL-aware aggregated place status
      description: |
        Exactly one of place_refs or bbox is required. place_refs is a comma-separated list of W1-07 stable graph ids. bbox is minLat,minLng,maxLat,maxLng in WGS-84 decimal degrees and is only a coarse query filter; it must not become a stored movement trace.
        Results are grouped by place+metric. An explicitly requested place_ref that is unknown in the school Campus Graph snapshot fails the whole request with PLACE_NOT_FOUND; bbox queries simply return an empty page when no known entity intersects the area. Current truth is evaluated from observed_at + fixed metric TTL, never from report ingestion time. Expired data is UNKNOWN. When TTL expiry recomputation changes effective_state, place.status.changed is emitted with trigger_type=TTL_EXPIRED. Contradictory unexpired reports are never collapsed into false consensus: effective_state becomes CONTESTED and divergent_states contains every simultaneous state with counts.
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: place_refs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              $ref: '#/components/schemas/PlaceRefValue'
        - name: bbox
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
            description: Coarse WGS-84 bounding box as minLat,minLng,maxLat,maxLng; exactly one of bbox or place_refs is required.
            example: '34.820,113.540,34.850,113.570'
        - name: place_types
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            description: Optional entity type filter; omission means every supported Campus Graph entity type.
            items:
              $ref: '#/components/schemas/PlaceEntityType'
        - name: metrics
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            description: Optional metric filter; omission means every v1 place status metric.
            items:
              $ref: '#/components/schemas/PlaceStatusMetric'
        - name: include_expired
          in: query
          required: false
          schema:
            type: boolean
            default: false
            description: For bbox queries, include places that have only expired eligible reports as UNKNOWN rows. Explicit place_refs always return their UNKNOWN rows. Expired reports never count as current truth.
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
