        retryable:
          type: boolean
        detail:
          type: object
    ErrorEnvelope:
      type: object
      required: [ok, code, request_id, error, meta]
      properties:
        ok:
          type: boolean
          const: false
        code:
          type: string
        request_id:
          type: string
        error:
