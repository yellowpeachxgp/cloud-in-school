        Moderation never edits user observations and never fabricates a corrected status. KEEP_VISIBLE or REJECT_FLAG leaves the report aggregation-eligible; EXCLUDE_INCORRECT or EXCLUDE_ABUSE makes only that report ineligible, after which the aggregate is recomputed from remaining eligible reports. If recomputation changes effective_state, place.status.changed is emitted. The response includes the post-review aggregate view so clients can correct display without pretending the original report was rewritten.
      parameters:
        - $ref: '#/components/parameters/PlaceReportFlagIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPlaceReportFlagRequest'
      responses:
        '200':
          description: Review decision applied with post-review aggregate view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceReportFlagReviewEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
