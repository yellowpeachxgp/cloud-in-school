asyncapi: 2.6.0
info:
  title: Day in School Campus Cloud Event & Outbox Contracts
  version: 1.0.0
  description: |
    Versioned AsyncAPI event envelopes for Transactional Outbox, Triple-Schedule Reservation Events (`PRECHECK` at T-30m, `FINAL_CHECK` at T-5m, `FIRE` at T), Finance Saga (`ORDER_CHARGE_REQUIRED`, `ORDER_REFUND_REQUIRED`), Parcel Sync Batch Streams, Security Audit Events, group collaboration events, append-only ledger events, dorm duty events, and repair workflow events.
defaultContentType: application/json
channels:
  reservation.schedule.precheck:
    description: T-30m initial read-only precheck event
    publish:
      operationId: publishReservationPrecheckEvent
      message:
        $ref: '#/components/messages/TripleScheduleEvent'
  reservation.schedule.final_check:
    description: T-5m read-only quality gate recheck event
    publish:
      operationId: publishReservationFinalCheckEvent
      message:
        $ref: '#/components/messages/TripleScheduleEvent'
  reservation.schedule.fire:
    description: Target T execution event (fail-closed unless school authorized and kill_switch=false)
    publish:
      operationId: publishReservationFireEvent
      message:
        $ref: '#/components/messages/TripleScheduleEvent'
  finance.saga.charge:
    description: Post-confirmation idempotent debit intent (`dis:reservation:<orderUUID>:debit:v1`)
    publish:
      operationId: publishOrderChargeRequired
      message:
        $ref: '#/components/messages/FinanceSagaEvent'
  finance.saga.refund:
    description: Approved idempotent refund intent (`dis:reservation:<orderUUID>:refund:v1`)
    publish:
      operationId: publishOrderRefundRequired
      message:
        $ref: '#/components/messages/FinanceSagaEvent'
  parcel.sync.batch:
    description: Incremental batch event from a parcel discovery provider (`PARTIAL` vs `COMPLETED`)
    publish:
      operationId: publishParcelSyncBatchEvent
      message:
        $ref: '#/components/messages/ParcelSyncBatchEvent'
  security.audit.recorded:
    description: Tamper-evident security, consent, and credential access audit event
    publish:
      operationId: publishSecurityAuditEvent
      message:
        $ref: '#/components/messages/SecurityAuditEvent'
  group.member.joined:
    description: Membership became active in a school-scoped group (creator owner or invite acceptance); consumer must treat event_key as idempotent.
    publish:
      operationId: publishGroupMemberJoinedEvent
      message:
        $ref: '#/components/messages/GroupMemberEvent'
  group.member.left:
    description: Membership ceased to be active (self leave, admin removal, or group archival); busy-block sharing is withdrawn immediately.
    publish:
      operationId: publishGroupMemberLeftEvent
      message:
        $ref: '#/components/messages/GroupMemberEvent'
  group.availability.updated:
    description: Busy-block share replaced, withdrawn, or expired; consumers must treat event_key as idempotent and must not infer event titles or reasons because only time blocks exist.
    publish:
      operationId: publishGroupAvailabilityUpdatedEvent
      message:
        $ref: '#/components/messages/GroupAvailabilityUpdatedEvent'
  group.event.confirmed:
    description: Poll confirmation created exactly one terminal group event; this event is informational and never writes to any school system.
    publish:
      operationId: publishGroupEventConfirmedEvent
      message:
        $ref: '#/components/messages/GroupEventConfirmedEvent'
  group.event.conflict_detected:
    description: A later shared busy block overlaps a confirmed group event; consumers may only prompt users for review and must never silently reschedule.
    publish:
      operationId: publishGroupEventConflictDetectedEvent
      message:
        $ref: '#/components/messages/GroupEventConflictDetectedEvent'
  ledger.entry.created:
    description: Append-only ledger posting created with deterministic integer-fen shares; consumers must treat event_key as idempotent and must not interpret it as a payment.
    publish:
      operationId: publishLedgerEntryCreatedEvent
      message:
        $ref: '#/components/messages/LedgerEntryCreatedEvent'
  ledger.entry.amended:
    description: Append-only correction posting linked to an earlier ledger entry; original postings are never rewritten.
    publish:
      operationId: publishLedgerEntryAmendedEvent
      message:
        $ref: '#/components/messages/LedgerEntryAmendedEvent'
  settlement.confirmed:
    description: Debtor and creditor both confirmed an out-of-band settlement record; this is mutual acknowledgement only, never payment success evidence.
    publish:
      operationId: publishSettlementConfirmedEvent
      message:
        $ref: '#/components/messages/SettlementConfirmedEvent'
  duty.task.completed:
    description: Assigned member marked a dorm duty task completed; peer confirmation is still required.
    publish:
      operationId: publishDutyTaskCompletedEvent
      message:
        $ref: '#/components/messages/DutyTaskEvent'
  duty.task.confirmed:
    description: A different active member confirmed completion of a dorm duty task.
    publish:
      operationId: publishDutyTaskConfirmedEvent
      message:
        $ref: '#/components/messages/DutyTaskEvent'
  duty.task.skipped:
    description: A group owner/admin marked a still-pending dorm duty task SKIPPED as the terminal leave disposition; it never counts as completion.
    publish:
      operationId: publishDutyTaskSkippedEvent
      message:
        $ref: '#/components/messages/DutyTaskEvent'
  duty.swap.requested:
    description: Duty swap or cover requested for one generated task; no reassignment occurs before acceptance.
    publish:
      operationId: publishDutySwapRequestedEvent
      message:
        $ref: '#/components/messages/DutySwapEvent'
  duty.swap.resolved:
    description: Duty swap accepted, rejected, or cancelled; accepted swaps atomically reassign the referenced task.
    publish:
      operationId: publishDutySwapResolvedEvent
      message:
        $ref: '#/components/messages/DutySwapEvent'
  repair.created:
    description: Dorm repair coordination record created; this is not an official school or property work order.
    publish:
      operationId: publishRepairCreatedEvent
      message:
        $ref: '#/components/messages/RepairWorkflowEvent'
  repair.status_changed:
    description: Dorm repair coordination status changed through the explicit state machine.
    publish:
      operationId: publishRepairStatusChangedEvent
      message:
        $ref: '#/components/messages/RepairWorkflowEvent'
  repair.reviewed:
    description: Reporter submitted the one-time review for a resolved dorm repair record.
    publish:
      operationId: publishRepairReviewedEvent
      message:
        $ref: '#/components/messages/RepairReviewedEvent'
components:
  messages:
    GroupMemberEvent:
      name: GroupMemberEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, member_id, cloud_user_id, actor_cloud_user_id, role, sharing_level, reason]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:member:[0-9a-fA-F-]{36}:(joined|left):v1$'
          event_type:
            type: string
            enum: [joined, left]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          member_id:
            type: string
            format: uuid
            description: Membership-period UUID; a leave followed by rejoin uses a fresh member_id, keeping joined/left event keys unique across lifecycle cycles.
          cloud_user_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          role:
            type: string
            enum: [OWNER, ADMIN, MEMBER]
          sharing_level:
            type: string
            enum: [NONE, BUSY_BLOCKS_30MIN]
            description: Effective sharing level after the transition; left events therefore carry NONE because sharing is withdrawn immediately.
          reason:
            type: string
            enum: [GROUP_CREATED, INVITE_ACCEPTED, SELF_LEFT, ADMIN_REMOVED, GROUP_ARCHIVED]
    GroupAvailabilityUpdatedEvent:
      name: GroupAvailabilityUpdatedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, member_id, cloud_user_id, actor_cloud_user_id, sharing_level, revision, block_count, expires_at, reason]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:availability:[0-9a-fA-F-]{36}:revision:[0-9]+:v1$'
          event_type:
            type: string
            enum: [updated]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          member_id:
            type: string
            format: uuid
          cloud_user_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          sharing_level:
            type: string
            enum: [NONE, BUSY_BLOCKS_30MIN]
          revision:
            type: integer
            minimum: 1
            description: Monotonic per-member share revision. Idempotent replay does not create a new revision or duplicate event.
          block_count:
            type: integer
            minimum: 0
            description: Count only; raw blocks are not embedded in the event payload.
          expires_at:
            type: [string, 'null']
            format: date-time
          reason:
            type: string
            enum: [SHARE_REPLACED, SHARE_WITHDRAWN, TTL_EXPIRED]
    GroupEventConfirmedEvent:
      name: GroupEventConfirmedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, poll_id, option_id, confirmed_event_id, start_at, end_at, confirmed_by_member_id, confirmed_by_cloud_user_id, vote_count, total_votes]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:event:[0-9a-fA-F-]{36}:confirmed:v1$'
          event_type:
            type: string
            enum: [confirmed]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          poll_id:
            type: string
            format: uuid
          option_id:
            type: string
            format: uuid
          confirmed_event_id:
            type: string
            format: uuid
          start_at:
            type: string
            format: date-time
          end_at:
            type: string
            format: date-time
          confirmed_by_member_id:
            type: string
            format: uuid
          confirmed_by_cloud_user_id:
            type: string
            format: uuid
          vote_count:
            type: integer
            minimum: 0
          total_votes:
            type: integer
            minimum: 0
    GroupEventConflictDetectedEvent:
      name: GroupEventConflictDetectedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, confirmed_event_id, poll_id, option_id, member_id, cloud_user_id, availability_revision, overlap_start_at, overlap_end_at, automatic_rescheduling]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:event:[0-9a-fA-F-]{36}:member:[0-9a-fA-F-]{36}:conflict:[0-9]+:v1$'
          event_type:
            type: string
            enum: [conflict_detected]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          confirmed_event_id:
            type: string
            format: uuid
          poll_id:
            type: string
            format: uuid
          option_id:
            type: string
            format: uuid
          member_id:
            type: string
            format: uuid
          cloud_user_id:
            type: string
            format: uuid
          availability_revision:
            type: integer
            minimum: 1
          overlap_start_at:
            type: string
            format: date-time
          overlap_end_at:
            type: string
            format: date-time
          automatic_rescheduling:
            type: boolean
            const: false
            description: Contractual sentinel proving the event is advisory only; consumers must prompt users and never silently move the confirmed event.
    LedgerEntryCreatedEvent:
      name: LedgerEntryCreatedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, entry_id, actor_member_id, actor_cloud_user_id, entry_kind, amount_fen, paid_by_member_id, share_count, balance_revision]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:ledger-entry:[0-9a-fA-F-]{36}:created:v1$'
          event_type:
            type: string
            enum: [created]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          entry_id:
            type: string
            format: uuid
          actor_member_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          entry_kind:
            type: string
            enum: [EXPENSE, REFUND]
          amount_fen:
            type: integer
            format: int64
          paid_by_member_id:
            type: string
            format: uuid
          share_count:
            type: integer
            minimum: 0
            description: Count only; individual shares are available through the ledger API and are not embedded in the event.
          balance_revision:
            type: integer
            minimum: 1
    LedgerEntryAmendedEvent:
      name: LedgerEntryAmendedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, entry_id, corrects_entry_id, actor_member_id, actor_cloud_user_id, amount_fen, paid_by_member_id, share_count, balance_revision]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:ledger-entry:[0-9a-fA-F-]{36}:correction:[0-9a-fA-F-]{36}:v1$'
          event_type:
            type: string
            enum: [amended]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          entry_id:
            type: string
            format: uuid
            description: Newly appended correction posting id.
          corrects_entry_id:
            type: string
            format: uuid
            description: Earlier posting or correction this delta is linked to; the target is never rewritten.
          actor_member_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          amount_fen:
            type: integer
            format: int64
            description: Signed correction delta in fen.
          paid_by_member_id:
            type: string
            format: uuid
          share_count:
            type: integer
            minimum: 0
          balance_revision:
            type: integer
            minimum: 1
    SettlementConfirmedEvent:
      name: SettlementConfirmedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, settlement_id, debtor_member_id, creditor_member_id, debtor_cloud_user_id, creditor_cloud_user_id, amount_fen, basis_balance_revision, applied_balance_revision, confirmed_at, payment_executed]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:settlement:[0-9a-fA-F-]{36}:confirmed:v1$'
          event_type:
            type: string
            enum: [confirmed]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          settlement_id:
            type: string
            format: uuid
          debtor_member_id:
            type: string
            format: uuid
          creditor_member_id:
            type: string
            format: uuid
          debtor_cloud_user_id:
            type: string
            format: uuid
          creditor_cloud_user_id:
            type: string
            format: uuid
          amount_fen:
            type: integer
            format: int64
            minimum: 1
          basis_balance_revision:
            type: integer
            minimum: 0
          applied_balance_revision:
            type: integer
            minimum: 1
            description: New balance revision after the confirmed out-of-band settlement is applied to member balances.
          confirmed_at:
            type: string
            format: date-time
          payment_executed:
            type: boolean
            const: false
            description: Contractual sentinel proving this event is only mutual ledger acknowledgement and never payment execution evidence.
    DutyTaskEvent:
      name: DutyTaskEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, rota_id, task_id, assigned_member_id, actor_member_id, actor_cloud_user_id, due_date, status]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:duty-task:[0-9a-fA-F-]{36}:(completed|confirmed|skipped):v1$'
          event_type:
            type: string
            enum: [completed, confirmed, skipped]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          rota_id:
            type: string
            format: uuid
          task_id:
            type: string
            format: uuid
          assigned_member_id:
            type: string
            format: uuid
          actor_member_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          due_date:
            type: string
            format: date
          status:
            type: string
            enum: [COMPLETED, CONFIRMED, SKIPPED]
    DutySwapEvent:
      name: DutySwapEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, rota_id, duty_task_id, swap_id, requested_by_member_id, target_member_id, actor_member_id, actor_cloud_user_id, swap_type, status, reassigned]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:duty-swap:[0-9a-fA-F-]{36}:(requested|resolved):v1$'
          event_type:
            type: string
            enum: [requested, resolved]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          rota_id:
            type: string
            format: uuid
          duty_task_id:
            type: string
            format: uuid
          swap_id:
            type: string
            format: uuid
          requested_by_member_id:
            type: string
            format: uuid
          target_member_id:
            type: string
            format: uuid
          actor_member_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          swap_type:
            type: string
            enum: [SWAP, COVER]
          status:
            type: string
            enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
          reassigned:
            type: boolean
            description: True only when status is ACCEPTED and the task assignment changed atomically.
    RepairWorkflowEvent:
      name: RepairWorkflowEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, repair_id, reporter_member_id, actor_member_id, actor_cloud_user_id, category, status, status_revision, official_work_order]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:repair:[0-9a-fA-F-]{36}:(created|status:[0-9]+):v1$'
          event_type:
            type: string
            enum: [created, status_changed]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          repair_id:
            type: string
            format: uuid
          reporter_member_id:
            type: string
            format: uuid
          actor_member_id:
            type: string
            format: uuid
          actor_cloud_user_id:
            type: string
            format: uuid
          category:
            type: string
            enum: [PLUMBING, ELECTRICAL, FURNITURE, NETWORK, CLEANING, SAFETY, OTHER]
          status:
            type: string
            enum: [OPEN, TRIAGED, IN_PROGRESS, RESOLVED, REJECTED, CLOSED]
          status_revision:
            type: integer
            minimum: 1
          official_work_order:
            type: boolean
            const: false
            description: Contractual sentinel proving the record is not an official school/property work order.
    RepairReviewedEvent:
      name: RepairReviewedEvent
      payload:
        type: object
        required: [event_id, event_key, event_type, occurred_at, group_id, school_id, repair_id, review_id, reviewer_member_id, reviewer_cloud_user_id, rating]
        properties:
          event_id:
            type: string
            format: uuid
          event_key:
            type: string
            pattern: '^dis:group:[0-9a-fA-F-]{36}:repair:[0-9a-fA-F-]{36}:review:[0-9a-fA-F-]{36}:v1$'
          event_type:
            type: string
            enum: [reviewed]
          occurred_at:
            type: string
            format: date-time
          group_id:
            type: string
            format: uuid
          school_id:
            type: string
          repair_id:
            type: string
            format: uuid
          review_id:
            type: string
            format: uuid
          reviewer_member_id:
            type: string
            format: uuid
          reviewer_cloud_user_id:
            type: string
            format: uuid
          rating:
            type: integer
            minimum: 1
            maximum: 5
    TripleScheduleEvent:
      name: TripleScheduleEvent
      payload:
        type: object
        required: [event_id, job_id, plan_id, kind, due_at, generation, school_id]
        properties:
          event_id:
            type: string
            format: uuid
          job_id:
            type: string
            format: uuid
          plan_id:
            type: string
            format: uuid
          kind:
            type: string
            enum: [PRECHECK, FINAL_CHECK, FIRE]
          due_at:
            type: string
            format: date-time
          generation:
            type: integer
          school_id:
            type: string
    FinanceSagaEvent:
      name: FinanceSagaEvent
      payload:
        type: object
        required: [event_id, order_id, cloud_user_id, kind, event_key, amount_micropeach]
        properties:
          event_id:
            type: string
            format: uuid
          order_id:
            type: string
            format: uuid
          cloud_user_id:
            type: string
            format: uuid
          kind:
            type: string
            enum: [DEBIT, REFUND]
          event_key:
            type: string
            pattern: '^dis:reservation:[0-9a-fA-F-]{36}:(debit|refund):v1$'
          amount_micropeach:
            type: integer
            minimum: 1
    ParcelSyncBatchEvent:
      name: ParcelSyncBatchEvent
      payload:
        type: object
        required: [job_id, provider_id, sequence, stage, items_received, items_merged, completeness, observed_at]
        properties:
          job_id:
            type: string
          provider_id:
            type: string
          source_account_ref:
            type: [string, 'null']
          sequence:
            type: integer
          stage:
            type: string
            enum: [STARTED, BATCH_COMMITTED, COMPLETED, FAILED]
          items_received:
            type: integer
          items_merged:
            type: integer
          completeness:
            type: string
            enum: [PARTIAL, COMPLETED]
          error:
            type: [string, 'null']
          observed_at:
            type: string
            format: date-time
    SecurityAuditEvent:
      name: SecurityAuditEvent
      payload:
        type: object
        required: [id, actor_kind, actor_ref, action, resource_kind, resource_ref, outcome, occurred_at]
        properties:
          id:
            type: string
            format: uuid
          actor_kind:
            type: string
          actor_ref:
            type: string
          action:
            type: string
          resource_kind:
            type: string
          resource_ref:
            type: string
          outcome:
            type: string
          occurred_at:
            type: string
            format: date-time
