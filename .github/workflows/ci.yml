name: Campus Cloud CI & Contract Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 准备隔离 PostgreSQL 17 测试镜像
        run: docker pull postgres:17-alpine

      - name: 检查全部 JavaScript 模块语法
        run: git ls-files -z '*.mjs' | xargs -0 -n1 node --check

      - name: Secret & Credential Leak Gate
        run: |
          if grep -RInE "(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|SSO_INTERNAL_SERVICE_KEY=[^<\s])" \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests --exclude=".env.example" .; then
            echo "Secret scan failed!"
            exit 1
          fi

      - name: Validate OpenAPI 3.1.2, JSON Schemas & SYSTEM_CONTRACT
        run: npm run contract:check

      - name: 输出云端权威契约哈希清单
        run: node tools/contract-ci/sync-contracts.mjs fingerprint --root .

      - name: Run Unit, Contract Parity, Triple-Schedule, Finance Saga, Plugin & Security Red-Team Tests
        run: npm test
